<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Classroom Voice Meter</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7fafc;
      color: #243447;
    }

    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: min(800px, 100%);
      background: white;
      border-radius: 28px;
      padding: 32px;
      box-shadow: 0 10px 35px rgba(0,0,0,.08);
      text-align: center;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 42px;
    }

    .subtitle {
      color: #64748b;
      font-size: 18px;
      margin-bottom: 24px;
    }

    .meter-area {
      display: flex;
      justify-content: center;
      align-items: stretch;
      gap: 20px;
      margin: 20px auto;
    }

    .labels {
      height: 460px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: right;
      font-weight: 700;
      font-size: 20px;
      padding: 5px 0;
    }

    .label-loud {
      color: #d85f73;
    }

    .label-right {
      color: #6676d8;
    }

    .label-quiet {
      color: #58a995;
    }

    .meter-shell {
      width: 150px;
      height: 460px;
      border-radius: 75px;
      background: #e8edf3;
      border: 5px solid #d5dce5;
      overflow: hidden;
      position: relative;
    }

    .meter-fill {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 0%;
      background: #75c9b7;
      transition:
        height .10s linear,
        background .20s ease;
    }

    .meter-line {
      position: absolute;
      left: 0;
      width: 100%;
      height: 2px;
      background: rgba(255,255,255,.8);
      z-index: 2;
    }

    .line-quiet {
      bottom: 38%;
    }

    .line-loud {
      bottom: 70%;
    }

    .status-box {
      min-width: 210px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .emoji {
      font-size: 86px;
      margin-bottom: 8px;
    }

    .status {
      font-size: 36px;
      font-weight: 700;
    }

    .controls {
      margin-top: 26px;
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 14px 24px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    #startBtn {
      background: #566fd8;
      color: white;
    }

    #stopBtn {
      background: #e9eef5;
      color: #243447;
    }

    button:disabled {
      opacity: .45;
      cursor: default;
    }

    .settings {
      margin-top: 26px;
      padding: 20px;
      background: #f5f7fa;
      border-radius: 20px;
    }

    .settings label {
      font-weight: 700;
      display: block;
      margin-bottom: 12px;
      font-size: 18px;
    }

    input[type="range"] {
      width: min(520px, 100%);
    }

    .range-labels {
      display: flex;
      justify-content: space-between;
      width: min(520px, 100%);
      margin: 7px auto 0;
      color: #64748b;
      font-size: 13px;
    }

    .sensitivity-value {
      margin-top: 12px;
      font-size: 18px;
      font-weight: 700;
      color: #566fd8;
    }

    .helper {
      margin-top: 8px;
      color: #64748b;
      font-size: 14px;
    }

    .message {
      margin-top: 18px;
      min-height: 22px;
      color: #9b2c2c;
      font-size: 15px;
    }

    @media (max-width: 650px) {
      h1 {
        font-size: 32px;
      }

      .meter-area {
        gap: 10px;
      }

      .meter-shell {
        width: 110px;
        height: 380px;
      }

      .labels {
        height: 380px;
        font-size: 16px;
      }

      .status-box {
        min-width: 120px;
      }

      .emoji {
        font-size: 58px;
      }

      .status {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

<div class="wrap">

  <div class="card">

    <h1>Classroom Voice Meter</h1>

    <div class="subtitle">
      Let's keep our classroom volume just right
    </div>

    <div class="meter-area">

      <div class="labels">
        <div class="label-loud">TOO LOUD</div>
        <div class="label-right">JUST RIGHT</div>
        <div class="label-quiet">QUIET</div>
      </div>

      <div class="meter-shell">

        <div class="meter-line line-loud"></div>
        <div class="meter-line line-quiet"></div>

        <div
          id="meterFill"
          class="meter-fill">
        </div>

      </div>

      <div class="status-box">

        <div
          id="emoji"
          class="emoji">
          🎤
        </div>

        <div
          id="status"
          class="status">
          Ready
        </div>

      </div>

    </div>

    <div class="controls">

      <button
        id="startBtn"
        type="button">
        🎤 Start Listening
      </button>

      <button
        id="stopBtn"
        type="button"
        disabled>
        Stop
      </button>

    </div>

    <div class="settings">

      <label for="sensitivity">
        Noise Sensitivity
      </label>

      <input
        id="sensitivity"
        type="range"
        min="50"
        max="500"
        step="10"
        value="200"
      >

      <div class="range-labels">
        <span>Less Sensitive</span>
        <span>More Sensitive</span>
      </div>

      <div
        id="sensitivityValue"
        class="sensitivity-value">
        Sensitivity: 200%
      </div>

      <div class="helper">
        Start around 200%. Adjust it later using the microphone on your classroom board.
      </div>

    </div>

    <div
      id="message"
      class="message">
    </div>

  </div>

</div>


<script>

let audioContext = null;
let analyser = null;
let source = null;
let stream = null;
let animationFrame = null;

let smoothedVolume = 0;
let loudStartTime = null;
let currentlyTooLoud = false;

const QUIET_LIMIT = 38;
const LOUD_LIMIT = 70;
const LOUD_DELAY = 1200;


const meterFill =
  document.getElementById('meterFill');

const statusEl =
  document.getElementById('status');

const emojiEl =
  document.getElementById('emoji');

const startBtn =
  document.getElementById('startBtn');

const stopBtn =
  document.getElementById('stopBtn');

const sensitivity =
  document.getElementById('sensitivity');

const sensitivityValue =
  document.getElementById('sensitivityValue');

const message =
  document.getElementById('message');


/* =========================================
   LOAD SAVED SENSITIVITY
========================================= */

const savedSensitivity =
  localStorage.getItem(
    'classroomVoiceSensitivityV2'
  );

if (savedSensitivity) {
  sensitivity.value = savedSensitivity;
}

updateSensitivityLabel();


sensitivity.addEventListener(
  'input',
  function() {

    updateSensitivityLabel();

    localStorage.setItem(
      'classroomVoiceSensitivityV2',
      sensitivity.value
    );

  }
);


function updateSensitivityLabel() {

  sensitivityValue.textContent =
    'Sensitivity: ' +
    sensitivity.value +
    '%';

}


/* =========================================
   BUTTONS
========================================= */

startBtn.addEventListener(
  'click',
  startListening
);

stopBtn.addEventListener(
  'click',
  stopListening
);


/* =========================================
   START MICROPHONE
========================================= */

async function startListening() {

  message.textContent = '';

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    message.textContent =
      'This browser does not support microphone access.';

    return;
  }

  try {

    stream =
      await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: false,
          autoGainControl: false
        }
      });

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    if (
      audioContext.state === 'suspended'
    ) {
      await audioContext.resume();
    }

    analyser =
      audioContext.createAnalyser();

    analyser.fftSize = 2048;

    analyser.smoothingTimeConstant = 0.82;

    source =
      audioContext.createMediaStreamSource(
        stream
      );

    source.connect(analyser);

    startBtn.disabled = true;
    stopBtn.disabled = false;

    statusEl.textContent =
      'Listening';

    emojiEl.textContent =
      '👂';

    updateMeter();

  }

  catch (error) {

    console.error(error);

    message.textContent =
      'Microphone error: ' +
      error.name +
      ' — ' +
      error.message;

    statusEl.textContent =
      'Microphone unavailable';

    emojiEl.textContent =
      '🚫🎤';
  }

}


/* =========================================
   STOP MICROPHONE
========================================= */

function stopListening() {

  if (animationFrame) {

    cancelAnimationFrame(
      animationFrame
    );

  }

  if (stream) {

    stream
      .getTracks()
      .forEach(
        track => track.stop()
      );

  }

  if (audioContext) {

    audioContext.close();

  }

  stream = null;
  audioContext = null;
  analyser = null;
  source = null;

  smoothedVolume = 0;
  loudStartTime = null;
  currentlyTooLoud = false;

  meterFill.style.height =
    '0%';

  meterFill.style.background =
    '#75c9b7';

  statusEl.textContent =
    'Ready';

  emojiEl.textContent =
    '🎤';

  startBtn.disabled = false;
  stopBtn.disabled = true;

}


/* =========================================
   READ SOUND
========================================= */

function updateMeter() {

  if (!analyser) {
    return;
  }

  const data =
    new Uint8Array(
      analyser.fftSize
    );

  analyser.getByteTimeDomainData(
    data
  );

  let total = 0;

  for (
    let i = 0;
    i < data.length;
    i++
  ) {

    const sample =
      (data[i] - 128) / 128;

    total +=
      sample * sample;

  }

  const rms =
    Math.sqrt(
      total / data.length
    );


  /* =======================================
     STRONGER MICROPHONE AMPLIFICATION
  ======================================= */

  const sensitivityMultiplier =
    Number(sensitivity.value) / 100;

  let rawVolume =
    rms *
    1000 *
    sensitivityMultiplier;


  rawVolume =
    Math.min(
      Math.max(
        rawVolume,
        0
      ),
      100
    );


  /* =======================================
     SMOOTH RISE + SLOW FALL
  ======================================= */

  if (
    rawVolume >
    smoothedVolume
  ) {

    smoothedVolume =
      smoothedVolume * 0.78 +
      rawVolume * 0.22;

  }

  else {

    smoothedVolume =
      smoothedVolume * 0.95 +
      rawVolume * 0.05;

  }


  meterFill.style.height =
    smoothedVolume + '%';


  setStatus(
    smoothedVolume
  );


  animationFrame =
    requestAnimationFrame(
      updateMeter
    );

}


/* =========================================
   STATUS
========================================= */

function setStatus(volume) {


  /* TOO LOUD */

  if (
    volume >= LOUD_LIMIT
  ) {

    if (!loudStartTime) {

      loudStartTime =
        Date.now();

    }

    const loudDuration =
      Date.now() -
      loudStartTime;


    if (
      loudDuration >=
      LOUD_DELAY
    ) {

      currentlyTooLoud = true;

    }

  }

  else {

    loudStartTime = null;


    if (
      volume <
      LOUD_LIMIT - 8
    ) {

      currentlyTooLoud = false;

    }

  }


  if (
    currentlyTooLoud
  ) {

    statusEl.textContent =
      'Too Loud';

    emojiEl.textContent =
      '😣';

    meterFill.style.background =
      '#e9838f';

    return;

  }


  /* QUIET */

  if (
    volume <
    QUIET_LIMIT
  ) {

    statusEl.textContent =
      'Quiet';

    emojiEl.textContent =
      '🤫';

    meterFill.style.background =
      '#75c9b7';

  }


  /* JUST RIGHT */

  else {

    statusEl.textContent =
      'Just Right';

    emojiEl.textContent =
      '🙂';

    meterFill.style.background =
      '#8aa7e8';

  }

}

</script>

</body>
</html>
