<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Classroom Voice Meter</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --navy: #334155;

      --quiet: #74cbb7;
      --quiet-light: #e8f8f4;

      --right: #8d9fe8;
      --right-light: #eef0ff;

      --loud: #e98798;
      --loud-light: #fdeef2;

      --background: #f4f7fb;
      --card: #ffffff;

      --border: #dbe4ee;
      --purple: #6676d8;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        "Trebuchet MS",
        "Arial Rounded MT Bold",
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at top left,
          #eef3ff 0,
          transparent 38%
        ),
        radial-gradient(
          circle at bottom right,
          #eaf8f5 0,
          transparent 38%
        ),
        var(--background);

      color: var(--navy);
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: min(920px, 100%);
      background: rgba(255,255,255,.96);

      border-radius: 34px;
      padding: 30px 34px 24px;

      box-shadow:
        0 20px 60px rgba(62, 77, 104, .13);

      border: 1px solid rgba(219,228,238,.85);
    }

    .top {
      text-align: center;
      margin-bottom: 18px;
    }

    .title {
      margin: 0;

      font-size: clamp(
        34px,
        5vw,
        52px
      );

      letter-spacing: -.5px;
      color: #36445b;
    }

    .subtitle {
      margin-top: 7px;
      font-size: 18px;
      color: #7b8798;
    }

    .meter-layout {
      display: grid;
      grid-template-columns:
        minmax(145px, 190px)
        180px
        minmax(190px, 240px);

      gap: 24px;

      justify-content: center;
      align-items: center;

      margin: 22px auto 16px;
    }

    /* -------------------------
       ZONE LABELS
    ------------------------- */

    .zone-labels {
      height: 500px;

      display: grid;
      grid-template-rows:
        28% 37% 35%;

      gap: 10px;
    }

    .zone-card {
      border-radius: 25px;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      padding: 12px;

      text-align: center;

      border: 2px solid transparent;
    }

    .zone-card .face {
      font-size: 43px;
      margin-bottom: 4px;
    }

    .zone-card .name {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: .3px;
    }

    .zone-card .hint {
      font-size: 13px;
      margin-top: 5px;
      opacity: .68;
    }

    .zone-loud {
      background: var(--loud-light);
      color: #c45f73;
      border-color: #f6d4dc;
    }

    .zone-right {
      background: var(--right-light);
      color: #6375cc;
      border-color: #dce1ff;
    }

    .zone-quiet {
      background: var(--quiet-light);
      color: #4f9d8c;
      border-color: #cef0e8;
    }

    /* -------------------------
       METER
    ------------------------- */

    .meter-shell {
      width: 180px;
      height: 500px;

      position: relative;
      overflow: hidden;

      border-radius: 90px;

      background:
        linear-gradient(
          to top,

          var(--quiet-light) 0%,
          var(--quiet-light) 35%,

          var(--right-light) 35%,
          var(--right-light) 72%,

          var(--loud-light) 72%,
          var(--loud-light) 100%
        );

      border: 6px solid white;

      box-shadow:
        0 0 0 3px #dce5ee,
        inset 0 0 18px rgba(70,90,110,.06),
        0 12px 30px rgba(71,87,111,.13);
    }

    .meter-fill {
      position: absolute;

      left: 0;
      bottom: 0;

      width: 100%;
      height: 0%;

      background: var(--quiet);

      border-radius:
        0 0 80px 80px;

      transition:
        height .10s linear,
        background .22s ease;
    }

    .meter-shine {
      position: absolute;

      left: 18%;
      top: 6%;

      width: 24%;
      height: 84%;

      border-radius: 999px;

      background:
        rgba(255,255,255,.22);

      pointer-events: none;
    }

    .zone-line {
      position: absolute;

      left: 8%;
      width: 84%;

      height: 3px;

      border-radius: 999px;

      background:
        rgba(255,255,255,.95);

      box-shadow:
        0 1px 2px rgba(0,0,0,.07);

      z-index: 4;
    }

    .quiet-line {
      bottom: 35%;
    }

    .loud-line {
      bottom: 72%;
    }

    /* -------------------------
       STATUS
    ------------------------- */

    .status-panel {
      text-align: center;
    }

    .status-bubble {
      min-height: 245px;

      display: flex;
      flex-direction: column;

      justify-content: center;
      align-items: center;

      padding: 20px;

      border-radius: 32px;

      background: #f7f9fc;

      border: 2px solid #e6ecf3;
    }

    .big-face {
      font-size: 105px;
      line-height: 1;
      margin-bottom: 10px;

      transition:
        transform .2s ease;
    }

    .status-text {
      font-size: 34px;
      font-weight: 900;
      line-height: 1.05;
    }

    .encouragement {
      margin-top: 9px;

      font-size: 15px;
      color: #7a8797;

      min-height: 20px;
    }

    /* -------------------------
       CONTROLS
    ------------------------- */

    .main-controls {
      display: flex;

      justify-content: center;
      gap: 12px;

      margin-top: 18px;

      flex-wrap: wrap;
    }

    button {
      font-family: inherit;

      border: 0;

      cursor: pointer;

      border-radius: 999px;

      padding: 14px 23px;

      font-size: 16px;
      font-weight: 800;

      transition:
        transform .15s ease,
        box-shadow .15s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: .42;
      cursor: default;
    }

    #startBtn {
      background: var(--purple);
      color: white;

      box-shadow:
        0 8px 18px rgba(102,118,216,.23);
    }

    #stopBtn {
      background: #edf1f6;
      color: #556377;
    }

    #settingsBtn {
      background: white;
      color: #69768a;

      border: 2px solid #e4eaf1;
    }

    /* -------------------------
       TEACHER SETTINGS
    ------------------------- */

    .teacher-settings {
      display: none;

      max-width: 660px;
      margin: 18px auto 0;

      padding: 18px 22px;

      border-radius: 24px;

      background: #f6f8fb;
      border: 1px solid #e3e9f0;
    }

    .teacher-settings.open {
      display: block;
    }

    .settings-title {
      font-size: 16px;
      font-weight: 800;

      margin-bottom: 12px;
    }

    .settings-row {
      display: flex;
      align-items: center;

      gap: 16px;
    }

    .slider-wrap {
      flex: 1;
    }

    input[type="range"] {
      width: 100%;
    }

    .range-labels {
      display: flex;

      justify-content: space-between;

      font-size: 12px;

      color: #8994a3;

      margin-top: 4px;
    }

    .setting-value {
      min-width: 92px;

      text-align: center;

      font-size: 14px;
      font-weight: 800;

      color: var(--purple);

      padding: 8px 10px;

      background: white;

      border-radius: 14px;

      border: 1px solid #e2e8ef;
    }

    .db-box {
      margin-top: 13px;

      font-size: 13px;
      color: #8390a0;
    }

    .db-box strong {
      color: #5f6e82;
    }

    .message {
      min-height: 20px;

      margin-top: 12px;

      text-align: center;

      color: #b34f62;

      font-size: 14px;
    }

    /* -------------------------
       RESPONSIVE
    ------------------------- */

    @media (max-width: 760px) {

      .meter-layout {
        grid-template-columns:
          120px 125px 145px;

        gap: 10px;
      }

      .zone-labels,
      .meter-shell {
        height: 400px;
      }

      .meter-shell {
        width: 125px;
      }

      .zone-card .face {
        font-size: 30px;
      }

      .zone-card .name {
        font-size: 15px;
      }

      .zone-card .hint {
        display: none;
      }

      .big-face {
        font-size: 65px;
      }

      .status-text {
        font-size: 23px;
      }

      .status-bubble {
        min-height: 190px;
        padding: 10px;
      }
    }

  </style>
</head>


<body>

<div class="page">

  <div class="card">

    <div class="top">

      <h1 class="title">
        Our Voice Meter
      </h1>

      <div class="subtitle">
        Let's keep our classroom voices just right!
      </div>

    </div>


    <div class="meter-layout">

      <!-- ZONE LABELS -->

      <div class="zone-labels">

        <div class="zone-card zone-loud">

          <div class="face">
            😣
          </div>

          <div class="name">
            TOO LOUD
          </div>

          <div class="hint">
            Let's bring it down
          </div>

        </div>


        <div class="zone-card zone-right">

          <div class="face">
            😊
          </div>

          <div class="name">
            JUST RIGHT
          </div>

          <div class="hint">
            Perfect classroom voices
          </div>

        </div>


        <div class="zone-card zone-quiet">

          <div class="face">
            🤫
          </div>

          <div class="name">
            QUIET
          </div>

          <div class="hint">
            Soft voices
          </div>

        </div>

      </div>


      <!-- VERTICAL METER -->

      <div class="meter-shell">

        <div
          id="meterFill"
          class="meter-fill">
        </div>

        <div class="zone-line quiet-line"></div>
        <div class="zone-line loud-line"></div>

        <div class="meter-shine"></div>

      </div>


      <!-- CURRENT STATUS -->

      <div class="status-panel">

        <div
          id="statusBubble"
          class="status-bubble">

          <div
            id="emoji"
            class="big-face">
            🎤
          </div>

          <div
            id="status"
            class="status-text">
            Ready!
          </div>

          <div
            id="encouragement"
            class="encouragement">
            Tap start to listen
          </div>

        </div>

      </div>

    </div>


    <!-- MAIN BUTTONS -->

    <div class="main-controls">

      <button
        id="startBtn"
        type="button">
        🎤 Start Listening
      </button>

      <button
        id="stopBtn"
        type="button"
        disabled>
        Stop
      </button>

      <button
        id="settingsBtn"
        type="button">
        ⚙️ Teacher Settings
      </button>

    </div>


    <!-- TEACHER SETTINGS -->

    <div
      id="teacherSettings"
      class="teacher-settings">

      <div class="settings-title">
        Teacher Settings
      </div>

      <div class="settings-row">

        <div class="slider-wrap">

          <input
            id="sensitivity"
            type="range"
            min="-25"
            max="25"
            step="1"
            value="0">

          <div class="range-labels">
            <span>Less Sensitive</span>
            <span>More Sensitive</span>
          </div>

        </div>

        <div
          id="sensitivityValue"
          class="setting-value">
          0
        </div>

      </div>

      <div class="db-box">
        Current microphone reading:
        <strong id="dbReadout">
          — dB
        </strong>
      </div>

    </div>


    <div
      id="message"
      class="message">
    </div>

  </div>

</div>


<script>

let audioContext = null;
let analyser = null;
let source = null;
let stream = null;
let animationFrame = null;

let smoothedLevel = 0;

let loudStartTime = null;
let currentlyTooLoud = false;

const LOUD_DELAY = 1200;

const QUIET_LIMIT = 35;
const LOUD_LIMIT = 72;


/* --------------------------------------
   ELEMENTS
-------------------------------------- */

const meterFill =
  document.getElementById(
    'meterFill'
  );

const statusEl =
  document.getElementById(
    'status'
  );

const emojiEl =
  document.getElementById(
    'emoji'
  );

const encouragementEl =
  document.getElementById(
    'encouragement'
  );

const statusBubble =
  document.getElementById(
    'statusBubble'
  );

const dbReadout =
  document.getElementById(
    'dbReadout'
  );

const startBtn =
  document.getElementById(
    'startBtn'
  );

const stopBtn =
  document.getElementById(
    'stopBtn'
  );

const settingsBtn =
  document.getElementById(
    'settingsBtn'
  );

const teacherSettings =
  document.getElementById(
    'teacherSettings'
  );

const sensitivity =
  document.getElementById(
    'sensitivity'
  );

const sensitivityValue =
  document.getElementById(
    'sensitivityValue'
  );

const message =
  document.getElementById(
    'message'
  );


/* --------------------------------------
   SAVED SENSITIVITY
-------------------------------------- */

const savedSensitivity =
  localStorage.getItem(
    'classroomVoiceDbSensitivity'
  );

if (
  savedSensitivity !== null
) {

  sensitivity.value =
    savedSensitivity;

}

updateSensitivityLabel();


sensitivity.addEventListener(
  'input',
  function() {

    updateSensitivityLabel();

    localStorage.setItem(
      'classroomVoiceDbSensitivity',
      sensitivity.value
    );

  }
);


function updateSensitivityLabel() {

  const value =
    Number(
      sensitivity.value
    );

  sensitivityValue.textContent =
    value > 0
      ? '+' + value
      : value;

}


/* --------------------------------------
   SETTINGS BUTTON
-------------------------------------- */

settingsBtn.addEventListener(
  'click',
  function() {

    teacherSettings
      .classList
      .toggle('open');

    if (
      teacherSettings
        .classList
        .contains('open')
    ) {

      settingsBtn.textContent =
        '✕ Hide Settings';

    }

    else {

      settingsBtn.textContent =
        '⚙️ Teacher Settings';

    }

  }
);


/* --------------------------------------
   START / STOP
-------------------------------------- */

startBtn.addEventListener(
  'click',
  startListening
);

stopBtn.addEventListener(
  'click',
  stopListening
);


/* --------------------------------------
   START MICROPHONE
-------------------------------------- */

async function startListening() {

  message.textContent = '';

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices
      .getUserMedia
  ) {

    message.textContent =
      'This browser does not support microphone access.';

    return;

  }

  try {

    stream =
      await navigator.mediaDevices
        .getUserMedia({

          audio: {

            echoCancellation: true,

            noiseSuppression: false,

            autoGainControl: false

          }

        });


    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();


    if (
      audioContext.state ===
      'suspended'
    ) {

      await audioContext.resume();

    }


    analyser =
      audioContext.createAnalyser();

    analyser.fftSize = 2048;

    analyser.smoothingTimeConstant =
      0.75;


    source =
      audioContext
        .createMediaStreamSource(
          stream
        );


    source.connect(
      analyser
    );


    startBtn.disabled = true;
    stopBtn.disabled = false;

    statusEl.textContent =
      'Listening';

    emojiEl.textContent =
      '👂';

    encouragementEl.textContent =
      'I can hear our classroom';

    updateMeter();

  }

  catch (error) {

    console.error(error);

    message.textContent =
      'Microphone error: ' +
      error.name +
      ' — ' +
      error.message;

    statusEl.textContent =
      'Microphone unavailable';

    emojiEl.textContent =
      '🚫🎤';

    encouragementEl.textContent =
      '';

  }

}


/* --------------------------------------
   STOP MICROPHONE
-------------------------------------- */

function stopListening() {

  if (
    animationFrame
  ) {

    cancelAnimationFrame(
      animationFrame
    );

  }


  if (
    stream
  ) {

    stream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

  }


  if (
    audioContext
  ) {

    audioContext.close();

  }


  stream = null;
  audioContext = null;
  analyser = null;
  source = null;

  smoothedLevel = 0;

  loudStartTime = null;
  currentlyTooLoud = false;


  meterFill.style.height =
    '0%';

  meterFill.style.background =
    'var(--quiet)';


  statusEl.textContent =
    'Ready!';

  emojiEl.textContent =
    '🎤';

  encouragementEl.textContent =
    'Tap start to listen';


  dbReadout.textContent =
    '— dB';


  startBtn.disabled = false;
  stopBtn.disabled = true;

}


/* --------------------------------------
   READ SOUND
-------------------------------------- */

function updateMeter() {

  if (
    !analyser
  ) {

    return;

  }


  const data =
    new Float32Array(
      analyser.fftSize
    );


  analyser
    .getFloatTimeDomainData(
      data
    );


  let sumSquares = 0;


  for (
    let i = 0;
    i < data.length;
    i++
  ) {

    sumSquares +=
      data[i] *
      data[i];

  }


  const rms =
    Math.sqrt(
      sumSquares /
      data.length
    );


  let db =
    rms > 0
      ? 20 *
        Math.log10(
          rms
        )
      : -100;


  const sensitivityOffset =
    Number(
      sensitivity.value
    );


  const adjustedDb =
    db +
    sensitivityOffset;


  const DB_FLOOR =
    -65;

  const DB_CEILING =
    -20;


  let level =
    (
      (
        adjustedDb -
        DB_FLOOR
      )
      /
      (
        DB_CEILING -
        DB_FLOOR
      )
    )
    * 100;


  level =
    Math.max(
      0,
      Math.min(
        level,
        100
      )
    );


  /*
    SMOOTH RISE / FALL
  */

  if (
    level >
    smoothedLevel
  ) {

    smoothedLevel =
      smoothedLevel *
      .78
      +
      level *
      .22;

  }

  else {

    smoothedLevel =
      smoothedLevel *
      .94
      +
      level *
      .06;

  }


  meterFill.style.height =
    smoothedLevel +
    '%';


  dbReadout.textContent =
    adjustedDb
      .toFixed(1)
    +
    ' dB';


  setStatus(
    smoothedLevel
  );


  animationFrame =
    requestAnimationFrame(
      updateMeter
    );

}


/* --------------------------------------
   STATUS
-------------------------------------- */

function setStatus(
  level
) {


  /*
    TOO LOUD MUST LAST
    FOR 1.2 SECONDS
  */

  if (
    level >=
    LOUD_LIMIT
  ) {

    if (
      !loudStartTime
    ) {

      loudStartTime =
        Date.now();

    }


    if (
      Date.now()
      -
      loudStartTime
      >=
      LOUD_DELAY
    ) {

      currentlyTooLoud =
        true;

    }

  }

  else {

    loudStartTime = null;


    if (
      level <
      64
    ) {

      currentlyTooLoud =
        false;

    }

  }


  /*
    TOO LOUD
  */

  if (
    currentlyTooLoud
  ) {

    statusEl.textContent =
      'Too Loud';

    emojiEl.textContent =
      '😣';

    encouragementEl.textContent =
      'Let’s bring our voices down';

    meterFill.style.background =
      'var(--loud)';

    statusBubble.style.background =
      'var(--loud-light)';

    statusBubble.style.borderColor =
      '#f6d4dc';

    return;

  }


  /*
    QUIET
  */

  if (
    level <
    QUIET_LIMIT
  ) {

    statusEl.textContent =
      'Quiet';

    emojiEl.textContent =
      '🤫';

    encouragementEl.textContent =
      'Nice soft voices';

    meterFill.style.background =
      'var(--quiet)';

    statusBubble.style.background =
      'var(--quiet-light)';

    statusBubble.style.borderColor =
      '#cef0e8';

  }


  /*
    JUST RIGHT
  */

  else {

    statusEl.textContent =
      'Just Right!';

    emojiEl.textContent =
      '😊';

    encouragementEl.textContent =
      'Perfect classroom voices';

    meterFill.style.background =
      'var(--right)';

    statusBubble.style.background =
      'var(--right-light)';

    statusBubble.style.borderColor =
      '#dce1ff';

  }

}

</script>

</body>
</html>
