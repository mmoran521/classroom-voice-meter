<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Classroom Timer</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --navy: #263a55;
  --text: #263a55;
  --muted: #718096;
  --border: #dfe6ee;
  --bg: #f4f7fb;
  --white: #ffffff;

  --green: #52bb8a;
  --green-light: #eaf8f1;

  --blue: #7fa5dd;
  --purple: #968bd5;
  --pink: #df8ca4;

  --shadow: 0 8px 24px rgba(45,65,90,.09);
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: "Trebuchet MS", Arial, sans-serif;
  color: var(--text);

  background:
    radial-gradient(circle at top left,#eef4ff,transparent 35%),
    radial-gradient(circle at bottom right,#ebf8f4,transparent 35%),
    var(--bg);
}

button,
input,
select {
  font: inherit;
}


/* ======================================================
   PAGE
====================================================== */

.page {
  width: min(1700px, calc(100% - 20px));
  margin: auto;
  padding: 22px 0 40px;
}


/* ======================================================
   HEADER
====================================================== */

.header {
  position: relative;
  display: grid;
  grid-template-columns: 220px 1fr 320px;
  align-items: center;
  gap: 15px;

  margin-bottom: 18px;
}

.header-center {
  text-align: center;
}

.header h1 {
  margin: 0;
  font-size: clamp(40px,5vw,64px);
  letter-spacing: -2px;
}

.header p {
  margin: 7px 0 0;
  color: var(--muted);
  font-size: 18px;
}

.header-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}

.header-button {
  min-height: 58px;

  border: 1px solid var(--border);
  background: white;

  padding: 0 20px;
  border-radius: 20px;

  font-weight: 900;
  color: var(--navy);

  cursor: pointer;

  box-shadow: var(--shadow);
}

.tools-button {
  justify-self: start;
}


/* ======================================================
   MAIN LAYOUT
====================================================== */

.main-layout {
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 22px;
}


/* ======================================================
   THEMES SIDEBAR
====================================================== */

.sidebar {
  background: rgba(255,255,255,.85);
  border: 1px solid var(--border);

  border-radius: 30px;
  padding: 18px;

  box-shadow: var(--shadow);
}

.sidebar-title {
  margin: 0 0 15px 4px;

  font-size: 16px;
  font-weight: 900;
}

.theme-list {
  display: flex;
  flex-direction: column;
  gap: 10px;

  max-height: 700px;
  overflow-y: auto;

  padding-right: 5px;
}

.theme-list::-webkit-scrollbar {
  width: 7px;
}

.theme-list::-webkit-scrollbar-thumb {
  background: #ccd6e2;
  border-radius: 20px;
}

.theme-button {
  width: 100%;

  display: grid;
  grid-template-columns: 62px 1fr;
  align-items: center;
  gap: 14px;

  min-height: 78px;

  background: white;
  border: 1px solid var(--border);

  border-radius: 20px;

  padding: 8px 12px;

  cursor: pointer;
  text-align: left;

  color: var(--navy);

  font-weight: 900;

  transition: .15s ease;
}

.theme-button:hover {
  transform: translateY(-1px);
  box-shadow: 0 5px 14px rgba(45,65,90,.08);
}

.theme-button.active {
  border: 2px solid var(--green);
  background: #fbfffd;
}

.thumbnail {
  width: 60px;
  height: 58px;

  border-radius: 14px;
  overflow: hidden;

  position: relative;

  background: #e9eef5;
}


/* ======================================================
   THUMBNAILS
====================================================== */

.thumb-ocean {
  background:
    linear-gradient(to bottom,
      #a9dff0 0 40%,
      #78cee9 40% 57%,
      #2284aa 57% 100%);
}

.thumb-ocean::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 32px;
  height: 3px;
  background: rgba(255,255,255,.8);
}

.thumb-rain {
  background:
    linear-gradient(#72839a,#c5d1dc);
}

.thumb-rain::after {
  content: "╱╱╱";
  position: absolute;
  inset: 9px 5px;
  color: rgba(255,255,255,.85);
  font-size: 25px;
  letter-spacing: 4px;
}

.thumb-storm {
  background:
    linear-gradient(#263b55,#67788c);
}

.thumb-storm::after {
  content: "⚡";
  position: absolute;
  inset: 4px;
  display: grid;
  place-items: center;
  font-size: 33px;
}

.thumb-snow {
  background:
    radial-gradient(circle at 20% 30%,white 0 3px,transparent 4px),
    radial-gradient(circle at 65% 24%,white 0 3px,transparent 4px),
    radial-gradient(circle at 50% 60%,white 0 3px,transparent 4px),
    linear-gradient(#b8def1,#eaf6fb);
}

.thumb-fall {
  background:
    radial-gradient(circle at 35% 40%,#c75538 0 12px,transparent 13px),
    radial-gradient(circle at 52% 30%,#e3973f 0 14px,transparent 15px),
    radial-gradient(circle at 66% 44%,#d66b34 0 13px,transparent 14px),
    linear-gradient(#f6dcc1 0 64%,#a88565 64%);
}

.thumb-fall::after {
  content: "";
  position: absolute;
  width: 7px;
  height: 30px;
  background: #704d39;
  left: 28px;
  bottom: 5px;
  border-radius: 4px;
}

.thumb-spring {
  background:
    radial-gradient(circle at 25% 33%,#f4a8bd 0 8px,transparent 9px),
    radial-gradient(circle at 50% 25%,#ee92ad 0 9px,transparent 10px),
    radial-gradient(circle at 72% 35%,#f4a8bd 0 8px,transparent 9px),
    linear-gradient(#bde6ef 0 60%,#99cf76 60%);
}

.thumb-beach {
  background:
    linear-gradient(#91d9ee 0 46%,#35a8cb 46% 66%,#ebcb80 66%);
}

.thumb-fire {
  background:
    linear-gradient(#413637,#6d5145);
}

.thumb-fire::after {
  content: "🔥";
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: 32px;
}


/* ======================================================
   CONTENT
====================================================== */

.content {
  min-width: 0;
}


/* ======================================================
   SCENE
====================================================== */

.scene-wrapper {
  position: relative;

  width: 100%;
  min-height: 570px;

  overflow: hidden;

  border-radius: 32px;

  box-shadow: var(--shadow);

  background: #dce7ef;
}

.scene {
  position: absolute;
  inset: 0;
  overflow: hidden;
}

.scene svg {
  width: 100%;
  height: 100%;
  display: block;
}


/* ======================================================
   TIMER FLOATING CARD
====================================================== */

.timer-display-card {
  position: absolute;

  right: 7%;
  top: 27%;

  width: min(420px,38%);

  padding: 28px;

  border-radius: 30px;

  text-align: center;

  background: rgba(255,255,255,.88);

  backdrop-filter: blur(8px);

  box-shadow:
    0 12px 35px rgba(40,50,70,.16);

  z-index: 30;
}

.timer-number {
  font-size: clamp(70px,8vw,130px);

  line-height: .95;

  font-weight: 900;

  letter-spacing: -5px;
}

.timer-label {
  margin-top: 18px;

  font-size: 24px;

  font-weight: 900;
}

.progress-track {
  margin-top: 24px;

  height: 11px;

  background: #dce5e1;

  border-radius: 20px;

  overflow: hidden;
}

.progress-fill {
  width: 100%;
  height: 100%;

  background: var(--green);

  border-radius: 20px;

  transition: width .35s linear;
}


/* ======================================================
   FULLSCREEN BUTTON
====================================================== */

.fullscreen-button {
  position: absolute;

  right: 22px;
  bottom: 20px;

  z-index: 40;

  width: 54px;
  height: 54px;

  border: 1px solid rgba(255,255,255,.6);

  background: rgba(255,255,255,.9);

  border-radius: 50%;

  font-size: 22px;

  cursor: pointer;
}


/* ======================================================
   CONTROLS
====================================================== */

.controls {
  display: grid;

  grid-template-columns: 1.3fr .95fr;
  gap: 20px;

  margin-top: 20px;
}

.control-card {
  background: rgba(255,255,255,.92);

  border: 1px solid var(--border);

  border-radius: 28px;

  padding: 20px;

  box-shadow: var(--shadow);
}

.control-title {
  margin-bottom: 14px;

  font-weight: 900;
}

.quick-grid {
  display: grid;

  grid-template-columns: repeat(7,1fr);

  gap: 10px;
}

.quick-button {
  min-height: 75px;

  border: 1px solid var(--border);

  background: white;

  border-radius: 18px;

  color: var(--navy);

  cursor: pointer;

  font-weight: 900;

  font-size: 22px;
}

.quick-button span {
  display: block;
  font-size: 11px;
  margin-top: 3px;
}

.quick-button.active {
  border: 2px solid var(--green);
  background: var(--green-light);
  color: #318562;
}


/* ======================================================
   CUSTOM TIMER
====================================================== */

.custom-row {
  display: grid;

  grid-template-columns: 60px 1fr 60px;

  align-items: center;

  gap: 12px;
}

.circle-button {
  width: 60px;
  height: 60px;

  border-radius: 50%;

  border: 1px solid var(--border);

  background: white;

  font-size: 28px;

  cursor: pointer;
}

.custom-display {
  min-height: 80px;

  display: grid;
  place-items: center;

  background: #f6f8fb;

  border: 1px solid var(--border);

  border-radius: 20px;

  font-size: 36px;

  font-weight: 900;
}

.custom-caption {
  margin-top: -23px;

  text-align: center;

  color: var(--muted);

  font-size: 11px;
}


/* ======================================================
   START BUTTONS
====================================================== */

.timer-actions {
  display: flex;

  justify-content: center;

  gap: 12px;

  margin-top: 20px;
}

.action-button {
  min-width: 150px;
  min-height: 58px;

  border: 0;

  border-radius: 18px;

  font-weight: 900;

  font-size: 17px;

  cursor: pointer;
}

.start-button {
  background: var(--green);
  color: white;
}

.pause-button {
  background: #eef3ff;
  color: #6076aa;
}

.reset-button {
  background: #f7edf1;
  color: #a46c7c;
}


/* ======================================================
   FALL ANIMATION
====================================================== */

.falling-leaf {
  transform-box: fill-box;
  transform-origin: center;

  animation:
    leafFall 8s linear infinite;
}

.falling-leaf:nth-child(2) {
  animation-delay: -2s;
}

.falling-leaf:nth-child(3) {
  animation-delay: -5s;
}

.falling-leaf:nth-child(4) {
  animation-delay: -3.4s;
}

.falling-leaf:nth-child(5) {
  animation-delay: -6.3s;
}

@keyframes leafFall {
  0% {
    transform:
      translateY(-120px)
      translateX(0)
      rotate(0deg);
    opacity: 0;
  }

  10% {
    opacity: 1;
  }

  50% {
    transform:
      translateY(270px)
      translateX(35px)
      rotate(170deg);
  }

  100% {
    transform:
      translateY(650px)
      translateX(-20px)
      rotate(360deg);
    opacity: .9;
  }
}


/* ======================================================
   RAIN
====================================================== */

.rain-line {
  animation: rainDrop 1.1s linear infinite;
}

@keyframes rainDrop {
  from {
    transform: translateY(-120px);
  }

  to {
    transform: translateY(600px);
  }
}


/* ======================================================
   SNOW
====================================================== */

.snowflake {
  animation: snowFall 7s linear infinite;
}

@keyframes snowFall {
  from {
    transform: translateY(-90px);
  }

  to {
    transform: translateY(620px);
  }
}


/* ======================================================
   OCEAN
====================================================== */

.wave {
  animation: waveMove 5s ease-in-out infinite alternate;
}

@keyframes waveMove {
  from {
    transform: translateX(-15px);
  }

  to {
    transform: translateX(20px);
  }
}


/* ======================================================
   FIRE
====================================================== */

.flame {
  transform-origin: bottom center;
  animation: flameMove .85s ease-in-out infinite alternate;
}

@keyframes flameMove {
  from {
    transform: scaleY(.92) rotate(-2deg);
  }

  to {
    transform: scaleY(1.08) rotate(2deg);
  }
}


/* ======================================================
   RESPONSIVE
====================================================== */

@media(max-width: 1000px) {

  .main-layout {
    grid-template-columns: 1fr;
  }

  .sidebar {
    order: 2;
  }

  .theme-list {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    max-height: none;
  }

  .theme-button {
    grid-template-columns: 50px 1fr;
  }

  .controls {
    grid-template-columns: 1fr;
  }

}

@media(max-width: 700px) {

  .header {
    grid-template-columns: 1fr;
  }

  .tools-button {
    justify-self: center;
  }

  .header-actions {
    justify-content: center;
  }

  .theme-list {
    grid-template-columns: repeat(2,1fr);
  }

  .scene-wrapper {
    min-height: 500px;
  }

  .timer-display-card {
    width: 80%;
    right: 10%;
    top: 48%;
  }

  .quick-grid {
    grid-template-columns: repeat(4,1fr);
  }

}

@media(prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {
    animation-duration: .01ms !important;
  }

}
</style>
</head>

</div>

</div>


</main>

</div>

/* =====================================================
   LOAD SCENE
===================================================== */

function loadScene(theme) {

  currentTheme = theme;

  scene.innerHTML =
    scenes[theme];

  document
    .querySelectorAll(".theme-button")
    .forEach(button => {

      button
        .classList
        .toggle(
          "active",
          button.dataset.theme === theme
        );

    });

}


document
  .querySelectorAll(".theme-button")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        loadScene(
          button.dataset.theme
        );

      }
    );

  });


/* =====================================================
   TIME FORMAT
===================================================== */

function formatTime(seconds) {

  const minutes =
    Math.floor(seconds / 60);

  const secs =
    seconds % 60;

  return (
    String(minutes)
      .padStart(2,"0")
    +
    ":"
    +
    String(secs)
      .padStart(2,"0")
  );

}


/* =====================================================
   UPDATE DISPLAY
===================================================== */

function updateDisplay() {

  const formatted =
    formatTime(
      remainingSeconds
    );

  timerNumber.textContent =
    formatted;

  customDisplay.textContent =
    formatTime(
      totalSeconds
    );


  const minutes =
    Math.ceil(
      remainingSeconds / 60
    );


  timerLabel.textContent =
    minutes === 1
      ? "1 minute"
      : minutes + " minutes";


  const percentage =
    totalSeconds > 0
      ? (
        remainingSeconds /
        totalSeconds
      ) * 100
      : 0;


  progressFill.style.width =
    percentage + "%";

}


/* =====================================================
   SET TIME
===================================================== */

function setMinutes(minutes) {

  stopTimer();

  selectedMinutes =
    Math.max(
      1,
      minutes
    );

  totalSeconds =
    selectedMinutes * 60;

  remainingSeconds =
    totalSeconds;


  document
    .querySelectorAll(".quick-button")
    .forEach(button => {

      button
        .classList
        .toggle(
          "active",
          Number(
            button.dataset.minutes
          ) ===
          selectedMinutes
        );

    });


  updateDisplay();

}


/* =====================================================
   QUICK SET
===================================================== */

document
  .querySelectorAll(".quick-button")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        setMinutes(
          Number(
            button.dataset.minutes
          )
        );

      }
    );

  });


/* =====================================================
   +/- BUTTONS
===================================================== */

document
  .getElementById("plusButton")
  .addEventListener(
    "click",
    () => {

      setMinutes(
        selectedMinutes + 1
      );

    }
  );


document
  .getElementById("minusButton")
  .addEventListener(
    "click",
    () => {

      setMinutes(
        Math.max(
          1,
          selectedMinutes - 1
        )
      );

    }
  );


/* =====================================================
   START
===================================================== */

document
  .getElementById("startButton")
  .addEventListener(
    "click",
    startTimer
  );


function startTimer() {

  if (
    running
  ) {
    return;
  }


  if (
    remainingSeconds <= 0
  ) {

    remainingSeconds =
      totalSeconds;

  }


  running = true;


  timerInterval =
    setInterval(
      () => {

        remainingSeconds--;


        if (
          remainingSeconds <= 0
        ) {

          remainingSeconds = 0;

          updateDisplay();

          stopTimer();

          timerFinished();

          return;

        }


        updateDisplay();

      },
      1000
    );

}


/* =====================================================
   PAUSE
===================================================== */

document
  .getElementById("pauseButton")
  .addEventListener(
    "click",
    stopTimer
  );


function stopTimer() {

  running = false;

  clearInterval(
    timerInterval
  );

  timerInterval = null;

}


/* =====================================================
   RESET
===================================================== */

document
  .getElementById("resetButton")
  .addEventListener(
    "click",
    () => {

      stopTimer();

      remainingSeconds =
        totalSeconds;

      updateDisplay();

    }
  );


/* =====================================================
   FINISHED SOUND
===================================================== */

function timerFinished() {

  timerLabel.textContent =
    "Time's up!";


  if (
    soundEnabled
  ) {

    playFinishedChime();

  }

}


function playFinishedChime() {

  const AudioCtx =
    window.AudioContext ||
    window.webkitAudioContext;


  if (
    !AudioCtx
  ) {
    return;
  }


  const ctx =
    new AudioCtx();


  const notes =
    [
      523,
      659,
      784
    ];


  notes.forEach(
    (frequency,index) => {

      const oscillator =
        ctx.createOscillator();

      const gain =
        ctx.createGain();


      oscillator.type =
        "sine";

      oscillator.frequency.value =
        frequency;


      const start =
        ctx.currentTime +
        index * .25;


      gain.gain
        .setValueAtTime(
          .001,
          start
        );


      gain.gain
        .exponentialRampToValueAtTime(
          .14,
          start + .03
        );


      gain.gain
        .exponentialRampToValueAtTime(
          .001,
          start + .65
        );


      oscillator.connect(
        gain
      );

      gain.connect(
        ctx.destination
      );


      oscillator.start(
        start
      );


      oscillator.stop(
        start + .7
      );

    }
  );


  setTimeout(
    () => {

      ctx.close();

    },
    2000
  );

}
