<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Classroom Timer</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --navy: #273b56;
  --muted: #748299;
  --border: #dfe6ee;
  --background: #f5f8fb;
  --white: #ffffff;
  --green: #55ba8b;
  --green-light: #eaf8f1;
  --shadow: 0 8px 26px rgba(44, 62, 85, .09);
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: "Trebuchet MS", Arial, sans-serif;
  color: var(--navy);

  background:
    radial-gradient(circle at top left, #edf4ff, transparent 35%),
    radial-gradient(circle at bottom right, #eef9f5, transparent 35%),
    var(--background);
}

button {
  font: inherit;
}

button,
.theme-button {
  -webkit-tap-highlight-color: transparent;
}

.page {
  width: min(1700px, calc(100% - 20px));
  margin: auto;
  padding: 22px 0 40px;
}


/* ==================================================
   HEADER
================================================== */

.header {
  display: grid;
  grid-template-columns: 220px 1fr 320px;
  align-items: center;
  gap: 15px;
  margin-bottom: 18px;
}

.header-center {
  text-align: center;
}

.header h1 {
  margin: 0;
  font-size: clamp(42px, 5vw, 64px);
  letter-spacing: -2px;
  line-height: 1;
}

.header p {
  margin: 9px 0 0;
  color: var(--muted);
  font-size: 18px;
}

.header-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}

.header-button {
  min-height: 60px;
  padding: 0 20px;

  border: 1px solid var(--border);
  border-radius: 20px;

  background: rgba(255,255,255,.95);
  color: var(--navy);

  font-weight: 900;
  cursor: pointer;

  box-shadow: var(--shadow);
}

.tools-button {
  justify-self: start;
}


/* ==================================================
   LAYOUT
================================================== */

.main-layout {
  display: grid;
  grid-template-columns: 280px minmax(0,1fr);
  gap: 22px;
}


/* ==================================================
   SIDEBAR
================================================== */

.sidebar {
  padding: 18px;

  border: 1px solid var(--border);
  border-radius: 30px;

  background: rgba(255,255,255,.88);
  box-shadow: var(--shadow);
}

.sidebar-title {
  margin: 2px 0 14px 4px;
  font-size: 16px;
  font-weight: 900;
}

.theme-list {
  display: flex;
  flex-direction: column;
  gap: 10px;

  max-height: 730px;
  overflow-y: auto;

  padding-right: 5px;
}

.theme-list::-webkit-scrollbar {
  width: 7px;
}

.theme-list::-webkit-scrollbar-thumb {
  background: #cdd7e3;
  border-radius: 20px;
}

.theme-button {
  display: grid;
  grid-template-columns: 62px 1fr;
  align-items: center;
  gap: 14px;

  width: 100%;
  min-height: 80px;

  padding: 8px 12px;

  border: 1px solid var(--border);
  border-radius: 20px;

  background: white;
  color: var(--navy);

  text-align: left;
  font-weight: 900;

  cursor: pointer;
  transition: .16s ease;
}

.theme-button:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 15px rgba(40,55,75,.08);
}

.theme-button.active {
  border: 2px solid var(--green);
  background: #fbfffd;
}

.thumb {
  width: 60px;
  height: 58px;

  border-radius: 14px;

  background-size: cover;
  background-position: center;

  box-shadow: inset 0 0 0 1px rgba(255,255,255,.35);
}


/* ==================================================
   THUMBNAILS
================================================== */

.thumb-ocean {
  background-image:
    url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=300&q=75");
}

.thumb-rain {
  background-image:
    url("https://images.unsplash.com/photo-1519692933481-e162a57d6721?auto=format&fit=crop&w=300&q=75");
}

.thumb-storm {
  background-image:
    url("https://images.unsplash.com/photo-1605727216801-e27ce1d0cc28?auto=format&fit=crop&w=300&q=75");
}

.thumb-snow {
  background-image:
    url("https://images.unsplash.com/photo-1483664852095-d6cc6870702d?auto=format&fit=crop&w=300&q=75");
}

.thumb-fall {
  background-image:
    url("https://images.unsplash.com/photo-1508261303786-1e81c2399ad8?auto=format&fit=crop&w=300&q=75");
}

.thumb-spring {
  background-image:
    url("https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=300&q=75");
}

.thumb-beach {
  background-image:
    url("https://images.unsplash.com/photo-1473116763249-2faaef81ccda?auto=format&fit=crop&w=300&q=75");
}

.thumb-fireplace {
  background-image:
    url("https://images.unsplash.com/photo-1603006905003-be475563bc59?auto=format&fit=crop&w=300&q=75");
}


/* ==================================================
   MAIN TIMER AREA
================================================== */

.content {
  min-width: 0;
}

.scene-wrapper {
  position: relative;

  width: 100%;
  min-height: 570px;

  overflow: hidden;

  border-radius: 32px;

  background: #d9e3ed;
  box-shadow: var(--shadow);
}


/* ==================================================
   REAL SCENIC BACKGROUND
================================================== */

.scene-photo {
  position: absolute;
  inset: 0;

  background-size: cover;
  background-position: center;

  transform: scale(1.01);

  transition:
    background-image .35s ease,
    background-position .35s ease;
}

.scene-photo::after {
  content: "";

  position: absolute;
  inset: 0;

  background:
    linear-gradient(
      90deg,
      rgba(20,30,40,.03),
      rgba(20,30,40,.00) 55%,
      rgba(20,30,40,.06)
    );

  pointer-events: none;
}


/* ==================================================
   THEME BACKGROUNDS
================================================== */

.scene-ocean {
  background-image:
    url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=2000&q=88");

  background-position: center 55%;
}

.scene-rain {
  background-image:
    url("https://images.unsplash.com/photo-1519692933481-e162a57d6721?auto=format&fit=crop&w=2000&q=88");

  background-position: center;
}

.scene-storm {
  background-image:
    url("https://images.unsplash.com/photo-1605727216801-e27ce1d0cc28?auto=format&fit=crop&w=2000&q=88");

  background-position: center;
}

.scene-snow {
  background-image:
    url("https://images.unsplash.com/photo-1483664852095-d6cc6870702d?auto=format&fit=crop&w=2000&q=88");

  background-position: center;
}

.scene-fall {
  background-image:
    url("https://images.unsplash.com/photo-1508261303786-1e81c2399ad8?auto=format&fit=crop&w=2000&q=88");

  background-position: center 55%;
}

.scene-spring {
  background-image:
    url("https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=2000&q=88");

  background-position: center;
}

.scene-beach {
  background-image:
    url("https://images.unsplash.com/photo-1473116763249-2faaef81ccda?auto=format&fit=crop&w=2000&q=88");

  background-position: center;
}

.scene-fireplace {
  background-image:
    url("https://images.unsplash.com/photo-1603006905003-be475563bc59?auto=format&fit=crop&w=2000&q=88");

  background-position: center;
}


/* ==================================================
   SOFT PHOTO FILTER
================================================== */

.scene-filter {
  position: absolute;
  inset: 0;

  z-index: 2;

  pointer-events: none;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.07),
      rgba(255,255,255,.01)
    );
}


/* ==================================================
   WEATHER / SCENE EFFECT LAYER
================================================== */

.effects {
  position: absolute;
  inset: 0;

  z-index: 5;

  overflow: hidden;

  pointer-events: none;
}


/* ==================================================
   FALL LEAVES
================================================== */

.leaf {
  position: absolute;
  top: -40px;

  width: 20px;
  height: 12px;

  border-radius: 100% 0 100% 0;

  background: #c55b32;

  opacity: .9;

  animation:
    leafDrop linear infinite;
}

.leaf:nth-child(2n) {
  background: #df8a35;
}

.leaf:nth-child(3n) {
  background: #a94431;
}

.leaf:nth-child(4n) {
  background: #e2a546;
}

@keyframes leafDrop {

  0% {
    transform:
      translate3d(0,-30px,0)
      rotate(0deg);
  }

  25% {
    transform:
      translate3d(35px,160px,0)
      rotate(100deg);
  }

  50% {
    transform:
      translate3d(-20px,330px,0)
      rotate(190deg);
  }

  75% {
    transform:
      translate3d(40px,480px,0)
      rotate(275deg);
  }

  100% {
    transform:
      translate3d(0,650px,0)
      rotate(360deg);
  }
}


/* ==================================================
   RAIN
================================================== */

.raindrop {
  position: absolute;
  top: -80px;

  width: 2px;
  height: 55px;

  background:
    linear-gradient(
      transparent,
      rgba(225,240,250,.8)
    );

  transform: rotate(12deg);

  animation:
    rainDrop linear infinite;
}

@keyframes rainDrop {

  from {
    transform:
      translateY(-80px)
      translateX(0)
      rotate(12deg);
  }

  to {
    transform:
      translateY(720px)
      translateX(-90px)
      rotate(12deg);
  }

}


/* ==================================================
   SNOW
================================================== */

.snowflake {
  position: absolute;
  top: -30px;

  width: 8px;
  height: 8px;

  background: white;

  border-radius: 50%;

  opacity: .85;

  box-shadow:
    0 0 8px rgba(255,255,255,.7);

  animation:
    snowDrop linear infinite;
}

@keyframes snowDrop {

  0% {
    transform:
      translate3d(0,-30px,0);
  }

  50% {
    transform:
      translate3d(25px,300px,0);
  }

  100% {
    transform:
      translate3d(-15px,650px,0);
  }

}


/* ==================================================
   OCEAN LIGHT
================================================== */

.ocean-light {
  position: absolute;
  left: -10%;
  bottom: 10%;

  width: 120%;
  height: 23%;

  opacity: .18;

  background:
    repeating-linear-gradient(
      175deg,
      transparent 0 18px,
      rgba(255,255,255,.75) 19px 22px,
      transparent 23px 42px
    );

  animation:
    oceanShift 7s ease-in-out infinite alternate;
}

@keyframes oceanShift {

  from {
    transform: translateX(-25px);
  }

  to {
    transform: translateX(25px);
  }

}


/* ==================================================
   FIREPLACE GLOW
================================================== */

.fire-glow {
  position: absolute;

  left: 19%;
  bottom: 12%;

  width: 240px;
  height: 180px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      rgba(255,193,92,.40),
      rgba(255,118,52,.16) 45%,
      transparent 72%
    );

  animation:
    fireGlow 1.7s ease-in-out infinite alternate;
}

@keyframes fireGlow {

  from {
    opacity: .55;
    transform: scale(.94);
  }

  to {
    opacity: .85;
    transform: scale(1.08);
  }

}


/* ==================================================
   TIMER CARD
================================================== */

.timer-display-card {
  position: absolute;

  top: 27%;
  right: 7%;

  z-index: 20;

  width: min(420px, 38%);

  padding: 30px;

  border: 1px solid rgba(255,255,255,.65);
  border-radius: 30px;

  background: rgba(255,255,255,.88);

  backdrop-filter: blur(14px);

  text-align: center;

  box-shadow:
    0 14px 40px rgba(24,38,55,.20);
}

.timer-number {
  font-size: clamp(72px, 8vw, 130px);
  line-height: .95;

  font-weight: 900;
  letter-spacing: -5px;
}

.timer-label {
  margin-top: 18px;

  font-size: 24px;
  font-weight: 900;
}

.progress-track {
  height: 11px;

  margin-top: 24px;

  overflow: hidden;

  border-radius: 30px;

  background: #dce6e2;
}

.progress-fill {
  width: 100%;
  height: 100%;

  border-radius: inherit;

  background: var(--green);

  transition: width .3s linear;
}


/* ==================================================
   FULLSCREEN
================================================== */

.fullscreen-button {
  position: absolute;

  right: 22px;
  bottom: 20px;

  z-index: 30;

  width: 55px;
  height: 55px;

  border: 1px solid rgba(255,255,255,.65);
  border-radius: 50%;

  background: rgba(255,255,255,.90);

  color: var(--navy);

  font-size: 22px;

  cursor: pointer;
}


/* ==================================================
   CONTROLS
================================================== */

.controls {
  display: grid;
  grid-template-columns: 1.3fr .95fr;
  gap: 20px;

  margin-top: 20px;
}

.control-card {
  padding: 20px;

  border: 1px solid var(--border);
  border-radius: 28px;

  background: rgba(255,255,255,.93);

  box-shadow: var(--shadow);
}

.control-title {
  margin-bottom: 14px;

  font-weight: 900;
}


/* ==================================================
   QUICK TIME
================================================== */

.quick-grid {
  display: grid;
  grid-template-columns: repeat(7,1fr);
  gap: 10px;
}

.quick-button {
  min-height: 76px;

  border: 1px solid var(--border);
  border-radius: 18px;

  background: white;
  color: var(--navy);

  font-size: 22px;
  font-weight: 900;

  cursor: pointer;
}

.quick-button span {
  display: block;

  margin-top: 4px;

  font-size: 11px;
}

.quick-button.active {
  border: 2px solid var(--green);

  background: var(--green-light);
  color: #318362;
}


/* ==================================================
   CUSTOM TIME
================================================== */

.custom-row {
  display: grid;
  grid-template-columns: 60px 1fr 60px;
  align-items: center;
  gap: 12px;
}

.circle-button {
  width: 60px;
  height: 60px;

  border: 1px solid var(--border);
  border-radius: 50%;

  background: white;

  font-size: 28px;

  cursor: pointer;
}

.custom-display {
  min-height: 80px;

  display: grid;
  place-items: center;

  border: 1px solid var(--border);
  border-radius: 20px;

  background: #f6f8fb;

  font-size: 36px;
  font-weight: 900;
}

.custom-caption {
  margin-top: -22px;

  text-align: center;

  color: var(--muted);

  font-size: 11px;
}


/* ==================================================
   TIMER BUTTONS
================================================== */

.timer-actions {
  display: flex;
  justify-content: center;
  gap: 12px;

  margin-top: 20px;
}

.action-button {
  min-width: 150px;
  min-height: 58px;

  border: 0;
  border-radius: 18px;

  font-size: 17px;
  font-weight: 900;

  cursor: pointer;
}

.start-button {
  background: var(--green);
  color: white;
}

.pause-button {
  background: #edf2ff;
  color: #6178ad;
}

.reset-button {
  background: #f8edf2;
  color: #a36a7c;
}


/* ==================================================
   FULLSCREEN STYLING
================================================== */

.scene-wrapper:fullscreen {
  border-radius: 0;
}

.scene-wrapper:fullscreen .timer-display-card {
  width: min(500px, 36%);
}


/* ==================================================
   RESPONSIVE
================================================== */

@media(max-width: 1000px) {

  .main-layout {
    grid-template-columns: 1fr;
  }

  .sidebar {
    order: 2;
  }

  .theme-list {
    display: grid;
    grid-template-columns: repeat(4,1fr);

    max-height: none;
  }

  .theme-button {
    grid-template-columns: 50px 1fr;
  }

  .thumb {
    width: 48px;
    height: 48px;
  }

  .controls {
    grid-template-columns: 1fr;
  }

}


@media(max-width: 700px) {

  .header {
    grid-template-columns: 1fr;
  }

  .tools-button {
    justify-self: center;
  }

  .header-actions {
    justify-content: center;
  }

  .scene-wrapper {
    min-height: 520px;
  }

  .timer-display-card {
    top: auto;
    left: 8%;
    right: 8%;
    bottom: 8%;

    width: 84%;
  }

  .theme-list {
    grid-template-columns: repeat(2,1fr);
  }

  .quick-grid {
    grid-template-columns: repeat(4,1fr);
  }

}


@media(prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {
    animation-duration: .01ms !important;
  }

}
</style>
</head>


<body>

<div class="page">


<header class="header">

  <button
    id="toolsButton"
    class="header-button tools-button"
    type="button">
    ⌂ Tools
  </button>


  <div class="header-center">

    <h1>
      Timer
    </h1>

    <p>
      Pick a time, pick a theme, and let's go.
    </p>

  </div>


  <div class="header-actions">

    <button
      id="soundButton"
      class="header-button"
      type="button">
      🔊 Sound
    </button>

    <button
      id="settingsButton"
      class="header-button"
      type="button">
      ⚙ Settings
    </button>

  </div>

</header>



<div class="main-layout">


<!-- SIDEBAR -->

<aside class="sidebar">

  <div class="sidebar-title">
    THEMES
  </div>


  <div class="theme-list">


    <button
      class="theme-button"
      data-theme="ocean"
      type="button">

      <div class="thumb thumb-ocean"></div>

      <div>Ocean</div>

    </button>


    <button
      class="theme-button"
      data-theme="rain"
      type="button">

      <div class="thumb thumb-rain"></div>

      <div>Rain</div>

    </button>


    <button
      class="theme-button"
      data-theme="storm"
      type="button">

      <div class="thumb thumb-storm"></div>

      <div>Thunderstorm</div>

    </button>


    <button
      class="theme-button"
      data-theme="snow"
      type="button">

      <div class="thumb thumb-snow"></div>

      <div>Snow</div>

    </button>


    <button
      class="theme-button active"
      data-theme="fall"
      type="button">

      <div class="thumb thumb-fall"></div>

      <div>Fall Leaves</div>

    </button>


    <button
      class="theme-button"
      data-theme="spring"
      type="button">

      <div class="thumb thumb-spring"></div>

      <div>Spring Garden</div>

    </button>


    <button
      class="theme-button"
      data-theme="beach"
      type="button">

      <div class="thumb thumb-beach"></div>

      <div>Beach</div>

    </button>


    <button
      class="theme-button"
      data-theme="fireplace"
      type="button">

      <div class="thumb thumb-fireplace"></div>

      <div>Fireplace</div>

    </button>


  </div>

</aside>



<!-- MAIN -->

<main class="content">


<div
  id="sceneWrapper"
  class="scene-wrapper">


  <div
    id="scenePhoto"
    class="scene-photo scene-fall">
  </div>


  <div class="scene-filter"></div>


  <div
    id="effects"
    class="effects">
  </div>



  <div class="timer-display-card">

    <div
      id="timerNumber"
      class="timer-number">
      05:00
    </div>


    <div
      id="timerLabel"
      class="timer-label">
      5 minutes
    </div>


    <div class="progress-track">

      <div
        id="progressFill"
        class="progress-fill">
      </div>

    </div>

  </div>



  <button
    id="fullscreenButton"
    class="fullscreen-button"
    type="button">
    ⛶
  </button>


</div>



<!-- CONTROLS -->

<div class="controls">


<section class="control-card">

  <div class="control-title">
    QUICK SET
  </div>


  <div class="quick-grid">


    <button
      class="quick-button"
      data-minutes="1"
      type="button">
      1
      <span>min</span>
    </button>


    <button
      class="quick-button"
      data-minutes="3"
      type="button">
      3
      <span>min</span>
    </button>


    <button
      class="quick-button active"
      data-minutes="5"
      type="button">
      5
      <span>min</span>
    </button>


    <button
      class="quick-button"
      data-minutes="10"
      type="button">
      10
      <span>min</span>
    </button>


    <button
      class="quick-button"
      data-minutes="15"
      type="button">
      15
      <span>min</span>
    </button>


    <button
      class="quick-button"
      data-minutes="20"
      type="button">
      20
      <span>min</span>
    </button>


    <button
      class="quick-button"
      data-minutes="30"
      type="button">
      30
      <span>min</span>
    </button>


  </div>

</section>



<section class="control-card">

  <div class="control-title">
    SET YOUR OWN TIME
  </div>


  <div class="custom-row">

    <button
      id="minusButton"
      class="circle-button"
      type="button">
      −
    </button>


    <div
      id="customDisplay"
      class="custom-display">
      05:00
    </div>


    <button
      id="plusButton"
      class="circle-button"
      type="button">
      +
    </button>

  </div>


  <div class="custom-caption">
    MM:SS
  </div>

</section>


</div>



<div class="timer-actions">

  <button
    id="startButton"
    class="action-button start-button"
    type="button">
    ▶ Start
  </button>


  <button
    id="pauseButton"
    class="action-button pause-button"
    type="button">
    ❚❚ Pause
  </button>


  <button
    id="resetButton"
    class="action-button reset-button"
    type="button">
    ↺ Reset
  </button>

</div>


</main>

</div>

</div>



<script>

/* ==================================================
   TIMER STATE
================================================== */

let selectedMinutes = 5;

let totalSeconds = 300;

let remainingSeconds = 300;

let timerInterval = null;

let running = false;

let soundEnabled = true;

let currentTheme = "fall";


const timerNumber =
  document.getElementById("timerNumber");

const timerLabel =
  document.getElementById("timerLabel");

const customDisplay =
  document.getElementById("customDisplay");

const progressFill =
  document.getElementById("progressFill");

const scenePhoto =
  document.getElementById("scenePhoto");

const effects =
  document.getElementById("effects");


/* ==================================================
   THEME CONFIG
================================================== */

const themes = {

  ocean: {
    className: "scene-ocean"
  },

  rain: {
    className: "scene-rain"
  },

  storm: {
    className: "scene-storm"
  },

  snow: {
    className: "scene-snow"
  },

  fall: {
    className: "scene-fall"
  },

  spring: {
    className: "scene-spring"
  },

  beach: {
    className: "scene-beach"
  },

  fireplace: {
    className: "scene-fireplace"
  }

};


/* ==================================================
   LOAD THEME
================================================== */

function loadTheme(themeName) {

  currentTheme = themeName;

  scenePhoto.className =
    "scene-photo " +
    themes[themeName].className;


  document
    .querySelectorAll(".theme-button")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.theme === themeName
      );

    });


  buildThemeEffects(themeName);

}


/* ==================================================
   EFFECTS
================================================== */

function buildThemeEffects(themeName) {

  effects.innerHTML = "";


  if (themeName === "fall") {

    createLeaves();

  }

  else if (
    themeName === "rain" ||
    themeName === "storm"
  ) {

    createRain(
      themeName === "storm"
        ? 42
        : 30
    );

  }

  else if (themeName === "snow") {

    createSnow();

  }

  else if (
    themeName === "ocean" ||
    themeName === "beach"
  ) {

    const light =
      document.createElement("div");

    light.className =
      "ocean-light";

    effects.appendChild(light);

  }

  else if (themeName === "fireplace") {

    const glow =
      document.createElement("div");

    glow.className =
      "fire-glow";

    effects.appendChild(glow);

  }

}


/* ==================================================
   FALL LEAVES
================================================== */

function createLeaves() {

  const amount = 18;


  for (
    let i = 0;
    i < amount;
    i++
  ) {

    const leaf =
      document.createElement("div");

    leaf.className =
      "leaf";


    leaf.style.left =
      (
        Math.random() *
        100
      ) + "%";


    leaf.style.animationDuration =
      (
        6 +
        Math.random() * 7
      ) + "s";


    leaf.style.animationDelay =
      (
        Math.random() *
        -10
      ) + "s";


    leaf.style.transform =
      "scale(" +
      (
        .6 +
        Math.random() * .8
      ) +
      ")";


    effects.appendChild(leaf);

  }

}


/* ==================================================
   RAIN
================================================== */

function createRain(amount) {

  for (
    let i = 0;
    i < amount;
    i++
  ) {

    const drop =
      document.createElement("div");

    drop.className =
      "raindrop";


    drop.style.left =
      (
        Math.random() *
        110
      ) + "%";


    drop.style.animationDuration =
      (
        .65 +
        Math.random() * .55
      ) + "s";


    drop.style.animationDelay =
      (
        Math.random() *
        -2
      ) + "s";


    drop.style.opacity =
      (
        .3 +
        Math.random() * .55
      );


    effects.appendChild(drop);

  }

}


/* ==================================================
   SNOW
================================================== */

function createSnow() {

  const amount = 42;


  for (
    let i = 0;
    i < amount;
    i++
  ) {

    const snow =
      document.createElement("div");

    snow.className =
      "snowflake";


    const size =
      4 +
      Math.random() * 8;


    snow.style.width =
      size + "px";

    snow.style.height =
      size + "px";


    snow.style.left =
      (
        Math.random() *
        100
      ) + "%";


    snow.style.animationDuration =
      (
        5 +
        Math.random() * 8
      ) + "s";


    snow.style.animationDelay =
      (
        Math.random() *
        -10
      ) + "s";


    snow.style.opacity =
      (
        .45 +
        Math.random() * .5
      );


    effects.appendChild(snow);

  }

}


/* ==================================================
   THEME BUTTONS
================================================== */

document
  .querySelectorAll(".theme-button")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        loadTheme(
          button.dataset.theme
        );

      }
    );

  });


/* ==================================================
   TIME FORMAT
================================================== */

function formatTime(seconds) {

  const minutes =
    Math.floor(
      seconds / 60
    );

  const secs =
    seconds % 60;


  return (
    String(minutes)
      .padStart(2,"0")
    +
    ":"
    +
    String(secs)
      .padStart(2,"0")
  );

}


/* ==================================================
   DISPLAY
================================================== */

function updateDisplay() {

  timerNumber.textContent =
    formatTime(
      remainingSeconds
    );


  customDisplay.textContent =
    formatTime(
      totalSeconds
    );


  if (
    remainingSeconds === 0
  ) {

    timerLabel.textContent =
      "Time's up!";

  }

  else {

    const minutes =
      Math.ceil(
        remainingSeconds / 60
      );


    timerLabel.textContent =
      minutes === 1
        ? "1 minute"
        : minutes +
          " minutes";

  }


  const percent =
    totalSeconds > 0
      ? (
          remainingSeconds /
          totalSeconds
        ) * 100
      : 0;


  progressFill.style.width =
    percent + "%";

}


/* ==================================================
   SET TIME
================================================== */

function setMinutes(minutes) {

  stopTimer();


  selectedMinutes =
    Math.max(
      1,
      minutes
    );


  totalSeconds =
    selectedMinutes *
    60;


  remainingSeconds =
    totalSeconds;


  document
    .querySelectorAll(".quick-button")
    .forEach(button => {

      button.classList.toggle(
        "active",
        Number(
          button.dataset.minutes
        ) ===
        selectedMinutes
      );

    });


  updateDisplay();

}


/* ==================================================
   QUICK SET
================================================== */

document
  .querySelectorAll(".quick-button")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        setMinutes(
          Number(
            button.dataset.minutes
          )
        );

      }
    );

  });


/* ==================================================
   CUSTOM +/-
================================================== */

document
  .getElementById("plusButton")
  .addEventListener(
    "click",
    () => {

      setMinutes(
        selectedMinutes + 1
      );

    }
  );


document
  .getElementById("minusButton")
  .addEventListener(
    "click",
    () => {

      setMinutes(
        Math.max(
          1,
          selectedMinutes - 1
        )
      );

    }
  );


/* ==================================================
   START
================================================== */

document
  .getElementById("startButton")
  .addEventListener(
    "click",
    startTimer
  );


function startTimer() {

  if (running) {
    return;
  }


  if (
    remainingSeconds <= 0
  ) {

    remainingSeconds =
      totalSeconds;

  }


  running = true;


  timerInterval =
    setInterval(
      () => {

        remainingSeconds--;


        if (
          remainingSeconds <= 0
        ) {

          remainingSeconds = 0;

          updateDisplay();

          stopTimer();

          timerFinished();

          return;

        }


        updateDisplay();

      },
      1000
    );

}


/* ==================================================
   PAUSE
================================================== */

document
  .getElementById("pauseButton")
  .addEventListener(
    "click",
    stopTimer
  );


function stopTimer() {

  running = false;

  clearInterval(
    timerInterval
  );

  timerInterval = null;

}


/* ==================================================
   RESET
================================================== */

document
  .getElementById("resetButton")
  .addEventListener(
    "click",
    () => {

      stopTimer();

      remainingSeconds =
        totalSeconds;

      updateDisplay();

    }
  );


/* ==================================================
   FINISH SOUND
================================================== */

function timerFinished() {

  if (
    soundEnabled
  ) {

    playFinishedChime();

  }

}


function playFinishedChime() {

  const AudioContextClass =
    window.AudioContext ||
    window.webkitAudioContext;


  if (
    !AudioContextClass
  ) {

    return;

  }


  const context =
    new AudioContextClass();


  const notes =
    [
      523.25,
      659.25,
      783.99
    ];


  notes.forEach(
    (frequency,index) => {

      const oscillator =
        context.createOscillator();

      const gain =
        context.createGain();


      oscillator.type =
        "sine";

      oscillator.frequency.value =
        frequency;


      const start =
        context.currentTime +
        index * .24;


      gain.gain.setValueAtTime(
        .001,
        start
      );


      gain.gain
        .exponentialRampToValueAtTime(
          .14,
          start + .03
        );


      gain.gain
        .exponentialRampToValueAtTime(
          .001,
          start + .7
        );


      oscillator.connect(gain);

      gain.connect(
        context.destination
      );


      oscillator.start(start);

      oscillator.stop(
        start + .75
      );

    }
  );


  setTimeout(
    () => {

      try {
        context.close();
      }
      catch {}

    },
    2200
  );

}


/* ==================================================
   SOUND
================================================== */

const soundButton =
  document.getElementById(
    "soundButton"
  );


soundButton.addEventListener(
  "click",
  () => {

    soundEnabled =
      !soundEnabled;


    soundButton.textContent =
      soundEnabled
        ? "🔊 Sound"
        : "🔇 Sound";

  }
);


/* ==================================================
   SETTINGS
================================================== */

document
  .getElementById("settingsButton")
  .addEventListener(
    "click",
    () => {

      alert(
        "We can add timer settings here later."
      );

    }
  );


/* ==================================================
   FULLSCREEN
================================================== */

document
  .getElementById(
    "fullscreenButton"
  )
  .addEventListener(
    "click",
    async () => {

      const wrapper =
        document.getElementById(
          "sceneWrapper"
        );


      try {

        if (
          !document.fullscreenElement
        ) {

          await wrapper
            .requestFullscreen();

        }

        else {

          await document
            .exitFullscreen();

        }

      }

      catch {}

    }
  );


/* ==================================================
   TOOLS BUTTON
================================================== */

document
  .getElementById("toolsButton")
  .addEventListener(
    "click",
    () => {

      window.location.href =
        "index.html";

    }
  );


/* ==================================================
   INITIALIZE
================================================== */

loadTheme("fall");

updateDisplay();

</script>

</body>
</html>
