<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Classroom Timer</title>

<style>

* {
  box-sizing: border-box;
}

:root {
  --navy: #17385f;
  --text: #274566;
  --muted: #71839a;

  --page: #f4f8fc;
  --white: #ffffff;

  --border: #dde7f0;

  --green: #48b980;
  --green-light: #eaf8f1;

  --blue: #6b86dc;
  --blue-light: #edf1ff;

  --pink: #e8899d;
  --pink-light: #fff0f3;

  --shadow:
    0 10px 30px rgba(39, 67, 95, 0.10);
}


/* =========================
   PAGE
========================= */

html,
body {
  margin: 0;
  min-height: 100%;
  background: var(--page);
  color: var(--navy);
  font-family:
    "Trebuchet MS",
    Arial,
    sans-serif;
}


button {
  font: inherit;
}


.page {
  width: min(1700px, calc(100% - 28px));
  margin: auto;
  padding: 14px 0 30px;
}


/* =========================
   HEADER
========================= */

.header {
  display: grid;
  grid-template-columns: 220px 1fr 320px;
  align-items: center;
  gap: 14px;

  margin-bottom: 14px;
}


.header-center {
  text-align: center;
}


.header-center h1 {
  margin: 0;

  font-size: clamp(46px, 5vw, 72px);
  line-height: 0.95;

  color: var(--navy);
}


.header-center p {
  margin: 8px 0 0;

  color: var(--muted);
  font-size: 18px;
}


.header-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}


.top-button {
  min-height: 56px;

  padding: 0 19px;

  border: 1px solid var(--border);
  border-radius: 18px;

  background: white;
  color: var(--navy);

  font-weight: 900;

  cursor: pointer;

  box-shadow: var(--shadow);
}


.tools-button {
  justify-self: start;
}


/* =========================
   MAIN LAYOUT
========================= */

.layout {
  display: grid;

  grid-template-columns:
    280px
    minmax(0, 1fr);

  gap: 18px;
}


/* =========================
   THEME SIDEBAR
========================= */

.sidebar {
  background: white;

  border: 1px solid var(--border);
  border-radius: 28px;

  padding: 16px;

  box-shadow: var(--shadow);
}


.sidebar-title {
  margin: 3px 5px 13px;

  font-size: 14px;
  font-weight: 900;

  letter-spacing: 1px;
}


.theme-list {
  display: flex;
  flex-direction: column;

  gap: 9px;
}


.theme-button {
  display: grid;

  grid-template-columns:
    58px
    1fr;

  align-items: center;

  gap: 12px;

  min-height: 70px;

  padding: 7px 11px;

  border: 1px solid var(--border);
  border-radius: 18px;

  background: white;

  color: var(--navy);

  font-weight: 900;

  text-align: left;

  cursor: pointer;

  transition:
    transform 0.15s ease,
    border 0.15s ease,
    background 0.15s ease;
}


.theme-button:hover {
  transform: translateY(-1px);
}


.theme-button.active {
  border: 2px solid #3bae75;

  background: #f2fbf6;

  color: #238a57;
}


.theme-icon {
  display: grid;
  place-items: center;

  width: 54px;
  height: 54px;

  border-radius: 15px;

  font-size: 31px;
}


.theme-icon.ocean {
  background: #dff5fb;
}


.theme-icon.fall {
  background: #fff0e5;
}


.theme-icon.snow {
  background: #eaf3fb;
}


.theme-icon.rain {
  background: #e7eef7;
}


.theme-icon.fire {
  background: #fff0e7;
}


.theme-icon.beach {
  background: #e6f7f6;
}


.theme-icon.bubbles {
  background: #edf0ff;
}


/* =========================
   VIDEO SCENE
========================= */

.scene {
  position: relative;

  min-height: 610px;

  overflow: hidden;

  border-radius: 30px;

  background:
    linear-gradient(
      145deg,
      #d9effb,
      #dfeefa
    );

  box-shadow: var(--shadow);
}


#themeVideo {
  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;

  z-index: 1;
}


/* subtle overlay so timer remains readable */

.video-overlay {
  position: absolute;

  inset: 0;

  z-index: 2;

  background:
    linear-gradient(
      90deg,
      rgba(9, 34, 58, 0.05),
      rgba(9, 34, 58, 0.01) 55%,
      rgba(9, 34, 58, 0.08)
    );

  pointer-events: none;
}


/* =========================
   VIDEO FALLBACK
========================= */

.video-fallback {
  position: absolute;

  inset: 0;

  z-index: 0;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  gap: 16px;

  background:
    linear-gradient(
      145deg,
      #cfeaf8,
      #eaf5fc
    );

  color: #54728f;
}


.fallback-icon {
  font-size: 110px;
}


.fallback-text {
  font-size: 24px;
  font-weight: 900;
}


/* =========================
   TIMER CARD
========================= */

.timer-card {
  position: absolute;

  z-index: 10;

  right: 6%;
  top: 50%;

  transform: translateY(-50%);

  width: min(470px, 40%);

  padding: 34px 32px 30px;

  text-align: center;

  background:
    rgba(255, 255, 255, 0.94);

  backdrop-filter: blur(8px);

  border-radius: 32px;

  box-shadow:
    0 18px 48px
    rgba(22, 50, 76, 0.22);
}


.timer-number {
  font-size:
    clamp(78px, 8vw, 142px);

  line-height: 0.94;

  letter-spacing: -6px;

  font-weight: 900;

  color: var(--navy);
}


.timer-label {
  margin-top: 18px;

  font-size: 25px;
  font-weight: 900;
}


.progress-track {
  height: 13px;

  margin-top: 25px;

  overflow: hidden;

  border-radius: 999px;

  background: #dfe7ed;
}


.progress-fill {
  width: 100%;
  height: 100%;

  border-radius: 999px;

  background: var(--green);

  transition:
    width 0.4s linear;
}


/* =========================
   FULLSCREEN
========================= */

.fullscreen-button {
  position: absolute;

  z-index: 12;

  right: 20px;
  bottom: 19px;

  width: 58px;
  height: 58px;

  border: none;
  border-radius: 50%;

  background: white;

  color: var(--navy);

  font-size: 26px;

  cursor: pointer;

  box-shadow:
    0 6px 18px
    rgba(20, 44, 70, 0.16);
}


/* =========================
   CONTROLS
========================= */

.controls {
  display: grid;

  grid-template-columns:
    1.4fr
    1fr;

  gap: 16px;

  margin-top: 16px;
}


.control-panel {
  padding: 18px 20px;

  border: 1px solid var(--border);
  border-radius: 26px;

  background: white;

  box-shadow: var(--shadow);
}


.control-title {
  margin-bottom: 12px;

  font-size: 14px;

  font-weight: 900;

  letter-spacing: 0.5px;
}


/* =========================
   QUICK TIMES
========================= */

.quick-grid {
  display: grid;

  grid-template-columns:
    repeat(7, 1fr);

  gap: 9px;
}


.quick-button {
  min-height: 80px;

  border: 1px solid var(--border);
  border-radius: 18px;

  background: white;

  color: var(--navy);

  font-size: 24px;

  font-weight: 900;

  cursor: pointer;
}


.quick-button small {
  display: block;

  margin-top: 4px;

  font-size: 11px;
}


.quick-button.active {
  border: 2px solid #38ad70;

  background: var(--green-light);

  color: #238a57;
}


/* =========================
   CUSTOM TIME
========================= */

.custom-row {
  display: grid;

  grid-template-columns:
    60px
    1fr
    60px;

  align-items: center;

  gap: 12px;
}


.round-button {
  width: 60px;
  height: 60px;

  border: 1px solid var(--border);
  border-radius: 50%;

  background: white;

  color: var(--navy);

  font-size: 30px;
  font-weight: 900;

  cursor: pointer;
}


.custom-display {
  min-height: 80px;

  display: grid;
  place-items: center;

  border-radius: 18px;

  background: #f2f5f8;

  border: 1px solid var(--border);

  font-size: 38px;
  font-weight: 900;
}


.custom-display small {
  display: block;

  margin-top: -9px;

  color: var(--muted);

  font-size: 10px;
}


/* =========================
   ACTION BUTTONS
========================= */

.actions {
  display: flex;

  justify-content: center;

  gap: 18px;

  margin-top: 17px;
}


.action-button {
  min-width: 220px;
  min-height: 66px;

  border: none;
  border-radius: 19px;

  color: white;

  font-size: 22px;
  font-weight: 900;

  cursor: pointer;

  box-shadow:
    0 7px 18px
    rgba(38, 59, 81, 0.13);
}


.start {
  background: var(--green);
}


.pause {
  background: var(--blue);
}


.reset {
  background: var(--pink);
}


/* =========================
   FULLSCREEN MODE
========================= */

.scene:fullscreen {

  width: 100vw;
  height: 100vh;

  border-radius: 0;

}


.scene:fullscreen .timer-card {

  right: 7%;

  width: 460px;

}


/* =========================
   RESPONSIVE
========================= */

@media (max-width: 1050px) {

  .layout {
    grid-template-columns: 1fr;
  }


  .sidebar {
    order: 2;
  }


  .theme-list {
    display: grid;

    grid-template-columns:
      repeat(4, 1fr);
  }


  .theme-button {
    grid-template-columns:
      50px
      1fr;
  }


  .theme-icon {
    width: 46px;
    height: 46px;

    font-size: 25px;
  }


  .controls {
    grid-template-columns: 1fr;
  }

}



@media (max-width: 720px) {

  .header {
    grid-template-columns: 1fr;
  }


  .tools-button {
    justify-self: center;
  }


  .header-actions {
    justify-content: center;
  }


  .theme-list {
    grid-template-columns:
      repeat(2, 1fr);
  }


  .timer-card {
    left: 7%;
    right: 7%;

    top: auto;
    bottom: 7%;

    transform: none;

    width: 86%;
  }


  .quick-grid {
    grid-template-columns:
      repeat(4, 1fr);
  }


  .actions {
    flex-wrap: wrap;
  }


  .action-button {
    min-width: 170px;
  }

}

</style>
</head>



<body>

<div class="page">


<!-- ======================
     HEADER
====================== -->

<header class="header">


<button

  id="toolsButton">
  ⌂ Tools
</button>



<div class="header-center">

  <h1>
    Timer
  </h1>

  </p>

</div>



<div class="header-actions">


<button

</button>


<button

<!-- ======================

<div class="layout">



<!-- ======================

<aside class="sidebar">


<div class="sidebar-title">

</div>

</button>



<button

  data-theme="rain">

    Rain
  </span>

</button>



<button
  class="theme-button"
  data-theme="fireplace">

    🔥
  </span>

  <span>

  </span>

</button>



<button
  class="theme-button"
  data-theme="beach">

  <span class="theme-icon beach">

  </span>

<script>

/* =========================
   VIDEO THEMES
========================= */

const themes = {

  ocean: {
    name: "Ocean Fish",
    icon: "🐠",
    video: "timer-videos/ocean.mp4"
  },

  fall: {
    name: "Falling Leaves",
    icon: "🍂",
    video: "timer-videos/fall.mp4"
  },

  snow: {
    name: "Snow",
    icon: "❄️",
    video: "timer-videos/snow.mp4"
  },

  rain: {
    name: "Rain",
    icon: "🌧️",
    video: "timer-videos/rain.mp4"
  },

  fireplace: {
    name: "Fireplace",
    icon: "🔥",
    video: "timer-videos/fireplace.mp4"
  },

  beach: {
    name: "Beach Waves",
    icon: "🌊",
    video: "timer-videos/beach.mp4"
  },

  bubbles: {
    name: "Bubbles",
    icon: "🫧",
    video: "timer-videos/bubbles.mp4"
  }

};



/* =========================
   SAVED SETTINGS
========================= */

let currentTheme =
  localStorage.getItem(
    "classroomTimerVideoTheme"
  ) || "ocean";


let savedMinutes =
  Number(
    localStorage.getItem(
      "classroomTimerMinutes"
    )
  ) || 5;


let soundOn =
  localStorage.getItem(
    "classroomTimerSound"
  ) !== "off";


let videoOn =
  localStorage.getItem(
    "classroomTimerVideo"
  ) !== "off";



/* =========================
   TIMER VARIABLES
========================= */

let totalSeconds =
  savedMinutes * 60;


let remainingSeconds =
  totalSeconds;


let timerInterval =
  null;



/* =========================
   ELEMENTS
========================= */

const timerNumber =
  document.getElementById(
    "timerNumber"
  );


const timerLabel =
  document.getElementById(
    "timerLabel"
  );


const customDisplay =
  document.getElementById(
    "customDisplay"
  );


const progressFill =
  document.getElementById(
    "progressFill"
  );


const themeVideo =
  document.getElementById(
    "themeVideo"
  );


const videoSource =
  document.getElementById(
    "videoSource"
  );


const videoFallback =
  document.getElementById(
    "videoFallback"
  );


const fallbackIcon =
  document.getElementById(
    "fallbackIcon"
  );


const fallbackText =
  document.getElementById(
    "fallbackText"
  );


const soundButton =
  document.getElementById(
    "soundButton"
  );


const videoButton =
  document.getElementById(
    "videoButton"
  );



/* =========================
   FORMAT TIME
========================= */

function formatTime(seconds) {

  const minutes =
    Math.floor(
      seconds / 60
    );


  const secs =
    seconds % 60;


  return (
    String(minutes)
      .padStart(2, "0")
    +
    ":"
    +
    String(secs)
      .padStart(2, "0")
  );

}



/* =========================
   DISPLAY
========================= */

function updateDisplay() {

  timerNumber.textContent =
    formatTime(
      remainingSeconds
    );


  customDisplay.textContent =
    formatTime(
      totalSeconds
    );


  if (
    remainingSeconds === 0
  ) {

    timerLabel.textContent =
      "Time's up!";

  }

  else {

    const mins =
      Math.ceil(
        remainingSeconds / 60
      );


    timerLabel.textContent =
      mins +
      " " +
      (
        mins === 1
          ? "minute"
          : "minutes"
      );

  }


  const percent =
    totalSeconds > 0
      ?
      (
        remainingSeconds /
        totalSeconds
      ) * 100
      :
      0;


  progressFill.style.width =
    percent + "%";

}



/* =========================
   SET TIME
========================= */

function setMinutes(minutes) {

  stopTimer();


  minutes =
    Math.max(
      1,
      minutes
    );


  totalSeconds =
    minutes * 60;


  remainingSeconds =
    totalSeconds;


  localStorage.setItem(
    "classroomTimerMinutes",
    minutes
  );


  document
    .querySelectorAll(
      ".quick-button"
    )
    .forEach(
      button => {

        button
          .classList
          .toggle(
            "active",
            Number(
              button.dataset.minutes
            ) === minutes
          );

      }
    );


  updateDisplay();

}



/* =========================
   START TIMER
========================= */

function startTimer() {

  if (
    timerInterval
  ) {
    return;
  }


  if (
    remainingSeconds <= 0
  ) {

    remainingSeconds =
      totalSeconds;

  }


  timerInterval =
    setInterval(
      () => {

        remainingSeconds--;


        if (
          remainingSeconds <= 0
        ) {

          remainingSeconds = 0;

          updateDisplay();

          stopTimer();

          playChime();

          return;

        }


        updateDisplay();

      },

      1000
    );

}



/* =========================
   PAUSE TIMER
========================= */

function stopTimer() {

  clearInterval(
    timerInterval
  );


  timerInterval =
    null;

}



/* =========================
   RESET
========================= */

function resetTimer() {

  stopTimer();


  remainingSeconds =
    totalSeconds;


  updateDisplay();

}



/* =========================
   LOAD VIDEO THEME
========================= */

function loadTheme(themeKey) {

  if (
    !themes[themeKey]
  ) {

    themeKey =
      "ocean";

  }


  currentTheme =
    themeKey;


  const theme =
    themes[themeKey];


  localStorage.setItem(
    "classroomTimerVideoTheme",
    themeKey
  );


  fallbackIcon.textContent =
    theme.icon;


  fallbackText.textContent =
    theme.name;


  document
    .querySelectorAll(
      ".theme-button"
    )
    .forEach(
      button => {

        button
          .classList
          .toggle(
            "active",
            button.dataset.theme ===
            themeKey
          );

      }
    );


  videoSource.src =
    theme.video;


  themeVideo.load();


  if (
    videoOn
  ) {

    themeVideo.style.display =
      "block";


    themeVideo
      .play()
      .catch(
        () => {}
      );

  }

}



/* =========================
   VIDEO TOGGLE
========================= */

function updateVideoButton() {

  if (
    videoOn
  ) {

    videoButton.textContent =
      "🎬 Video On";


    themeVideo.style.display =
      "block";


    themeVideo
      .play()
      .catch(
        () => {}
      );

  }

  else {

    videoButton.textContent =
      "🎬 Video Off";


    themeVideo.pause();


    themeVideo.style.display =
      "none";

  }

}



/* =========================
   SOUND
========================= */

function updateSoundButton() {

}



function playChime() {

  if (
    !soundOn
  ) {
    return;
  }


  const AudioContext =
    window.AudioContext ||
    window.webkitAudioContext;


  if (
    !AudioContext
  ) {
    return;
  }


  const context =
    new AudioContext();


  const notes = [
    523.25,
    659.25,
    783.99
  ];


  notes.forEach(
    (frequency, index) => {

      const oscillator =
        context.createOscillator();


      const gain =
        context.createGain();


      const start =
        context.currentTime +
        index * 0.22;


      oscillator.type =
        "sine";


      oscillator.frequency.value =
        frequency;


      gain.gain
        .setValueAtTime(
          0.001,
          start
        );


      gain.gain
        .exponentialRampToValueAtTime(
          0.13,
          start + 0.03
        );


      gain.gain
        .exponentialRampToValueAtTime(
          0.001,
          start + 0.7
        );


      oscillator.connect(
        gain
      );


      gain.connect(
        context.destination
      );


      oscillator.start(
        start
      );


      oscillator.stop(
        start + 0.8
      );

    }
  );


  setTimeout(
    () => {

      context
        .close()
        .catch(
          () => {}
        );

    },

    1800
  );

}
