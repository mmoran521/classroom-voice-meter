<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Classroom Timer</title>

<style>
*{box-sizing:border-box}

:root{
  --navy:#16345c;
  --muted:#6f7f95;
  --bg:#f5f9fd;
  --card:#fff;
  --border:#dfe8f2;
  --green:#43b97f;
  --blue:#5f7dd9;
  --red:#e45c62;
  --shadow:0 10px 28px rgba(42,68,98,.10);
}

html,body{
  margin:0;
  min-height:100%;
  font-family:"Trebuchet MS",Arial,sans-serif;
  color:var(--navy);
  background:var(--bg);
}

button{font:inherit}

.page{
  width:min(1700px,calc(100% - 24px));
  margin:auto;
  padding:14px 0 28px;
}

.topbar{
  display:grid;
  grid-template-columns:220px 1fr 320px;
  gap:14px;
  align-items:center;
  margin-bottom:12px;
}

.brand{text-align:center}

.brand h1{
  margin:0;
  font-size:clamp(44px,5vw,72px);
  line-height:.95;
  letter-spacing:-3px;
}

.brand p{
  margin:8px 0 0;
  color:var(--muted);
  font-size:18px;
}

.top-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
}

.top-btn{
  min-height:56px;
  padding:0 18px;
  border:1px solid var(--border);
  border-radius:18px;
  background:#fff;
  color:var(--navy);
  font-weight:900;
  box-shadow:var(--shadow);
  cursor:pointer;
}

.tools{justify-self:start}

.layout{
  display:grid;
  grid-template-columns:280px minmax(0,1fr);
  gap:18px;
}

.sidebar{
  background:#fff;
  border:1px solid var(--border);
  border-radius:28px;
  padding:16px;
  box-shadow:var(--shadow);
}

.sidebar h2{
  font-size:16px;
  margin:2px 4px 12px;
}

.theme-list{
  display:flex;
  flex-direction:column;
  gap:8px;
  max-height:820px;
  overflow:auto;
  padding-right:3px;
}

.theme{
  display:grid;
  grid-template-columns:64px 1fr;
  gap:12px;
  align-items:center;
  min-height:72px;
  padding:7px 10px;
  border:1px solid var(--border);
  border-radius:18px;
  background:#fff;
  color:var(--navy);
  font-weight:900;
  text-align:left;
  cursor:pointer;
}

.theme.active{
  border:2px solid #2daa69;
  background:#fbfffd;
  color:#19864c;
}

.theme img{
  width:58px;
  height:58px;
  object-fit:cover;
  border-radius:13px;
  background:#edf3f8;
}

.scene{
  position:relative;
  min-height:610px;
  border-radius:30px;
  overflow:hidden;
  background:#dcecff;
  box-shadow:var(--shadow);
}

.scene-bg{
  position:absolute;
  inset:0;
  background-position:center;
  background-size:cover;
  transition:background-image .25s ease;
}

.scene-shade{
  position:absolute;
  inset:0;
  background:linear-gradient(
    90deg,
    rgba(255,255,255,.02),
    rgba(255,255,255,.00) 58%,
    rgba(255,255,255,.08)
  );
  pointer-events:none;
}

.fx{
  position:absolute;
  inset:0;
  overflow:hidden;
  pointer-events:none;
}

.timer-card{
  position:absolute;
  z-index:20;
  right:5.8%;
  top:25%;
  width:min(465px,40%);
  padding:32px 30px 28px;
  border-radius:32px;
  background:rgba(255,255,255,.93);
  box-shadow:0 18px 45px rgba(31,54,80,.18);
  text-align:center;
  backdrop-filter:blur(9px);
}

.time{
  font-size:clamp(78px,8vw,142px);
  font-weight:900;
  line-height:.92;
  letter-spacing:-6px;
}

.time-label{
  font-size:25px;
  font-weight:900;
  margin-top:18px;
}

.progress{
  height:12px;
  border-radius:99px;
  background:#e2e9ee;
  overflow:hidden;
  margin-top:24px;
}

.progress > div{
  height:100%;
  width:100%;
  background:var(--green);
  border-radius:99px;
  transition:width .3s linear;
}

.full{
  position:absolute;
  z-index:25;
  right:20px;
  bottom:18px;
  width:58px;
  height:58px;
  border:0;
  border-radius:50%;
  background:#fff;
  color:var(--navy);
  font-size:25px;
  box-shadow:0 6px 18px rgba(0,0,0,.12);
  cursor:pointer;
}

.controls{
  display:grid;
  grid-template-columns:1.45fr 1fr;
  gap:16px;
  margin-top:16px;
}

.panel{
  background:#fff;
  border:1px solid var(--border);
  border-radius:26px;
  padding:18px 20px;
  box-shadow:var(--shadow);
}

.panel-title{
  font-weight:900;
  margin-bottom:12px;
}

.quick{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:9px;
}

.quick button{
  min-height:82px;
  border:1px solid var(--border);
  border-radius:18px;
  background:#fff;
  color:var(--navy);
  font-size:23px;
  font-weight:900;
  cursor:pointer;
}

.quick button small{
  display:block;
  font-size:11px;
  margin-top:4px;
}

.quick button.active{
  border:2px solid #2daa69;
  background:#eef9f2;
  color:#187d49;
}

.custom{
  display:grid;
  grid-template-columns:60px 1fr 60px;
  gap:12px;
  align-items:center;
}

.round{
  width:60px;
  height:60px;
  border:1px solid var(--border);
  border-radius:50%;
  background:#fff;
  color:var(--navy);
  font-size:28px;
  font-weight:900;
  cursor:pointer;
}

.custom-display{
  display:grid;
  place-items:center;
  min-height:82px;
  border-radius:18px;
  background:#f2f5f8;
  border:1px solid var(--border);
  font-size:38px;
  font-weight:900;
}

.custom-display small{
  display:block;
  color:var(--muted);
  font-size:11px;
  line-height:1;
  margin-top:-12px;
}

.actions{
  display:flex;
  justify-content:center;
  gap:18px;
  margin-top:16px;
}

.action{
  min-width:225px;
  min-height:66px;
  border:0;
  border-radius:18px;
  color:#fff;
  font-size:22px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 7px 18px rgba(41,64,91,.12);
}

.start{background:var(--green)}
.pause{background:var(--blue)}
.reset{background:var(--red)}


/* FALL */

.leaf{
  position:absolute;
  top:-50px;
  width:22px;
  height:14px;
  border-radius:80% 0 80% 0;
  background:#ef8b21;
  animation:fall linear infinite;
}

.leaf.red{background:#df4b26}
.leaf.gold{background:#f3b63d}

@keyframes fall{
  0%{
    transform:translate(0,-50px) rotate(0);
  }

  50%{
    transform:translate(35px,320px) rotate(190deg);
  }

  100%{
    transform:translate(-10px,700px) rotate(380deg);
  }
}


/* OCEAN */

.fish{
  position:absolute;
  width:82px;
  height:48px;
  background-size:contain;
  background-repeat:no-repeat;
  background-position:center;
  animation:swim linear infinite;
}

@keyframes swim{
  from{
    transform:translateX(-140px);
  }

  to{
    transform:translateX(calc(100vw + 180px));
  }
}

.bubble{
  position:absolute;
  bottom:-30px;
  border:2px solid rgba(255,255,255,.8);
  border-radius:50%;
  background:rgba(255,255,255,.16);
  animation:rise linear infinite;
}

@keyframes rise{
  to{
    transform:translateY(-760px);
    opacity:.1;
  }
}


/* SNOW */

.snow{
  position:absolute;
  top:-20px;
  background:#fff;
  border-radius:50%;
  box-shadow:0 0 8px #fff;
  animation:snowfall linear infinite;
}

@keyframes snowfall{
  to{
    transform:translateY(720px) translateX(20px);
  }
}


/* SPRING */

.butterfly{
  position:absolute;
  font-size:34px;
  animation:flutter 9s ease-in-out infinite alternate;
}

@keyframes flutter{
  0%{
    transform:translate(0,0) rotate(-8deg);
  }

  25%{
    transform:translate(100px,-55px) rotate(8deg);
  }

  50%{
    transform:translate(210px,25px);
  }

  75%{
    transform:translate(330px,-40px);
  }

  100%{
    transform:translate(440px,10px) rotate(-8deg);
  }
}


/* RAIN */

.rain{
  position:absolute;
  top:-70px;
  width:2px;
  height:62px;
  background:linear-gradient(
    transparent,
    rgba(235,248,255,.9)
  );
  transform:rotate(10deg);
  animation:rain .8s linear infinite;
}

@keyframes rain{
  to{
    transform:translate(-70px,760px) rotate(10deg);
  }
}


/* FIRE */

.glow{
  position:absolute;
  left:20%;
  bottom:13%;
  width:260px;
  height:190px;
  border-radius:50%;
  background:radial-gradient(
    circle,
    rgba(255,196,78,.48),
    rgba(255,103,42,.17) 45%,
    transparent 72%
  );
  animation:glow 1.2s ease-in-out infinite alternate;
}

@keyframes glow{
  to{
    transform:scale(1.09);
    opacity:.7;
  }
}


/* BALLOON / ROCKET / COASTER */

.traveler{
  position:absolute;
  width:110px;
  height:110px;
  background-size:contain;
  background-repeat:no-repeat;
  background-position:center;
  transition:transform .8s ease;
}

.balloon{
  left:16%;
  top:10%;
}

.rocket{
  left:8%;
  bottom:12%;
}

.coaster{
  left:8%;
  bottom:17%;
  width:130px;
  height:90px;
}


@media(max-width:1050px){

  .layout{
    grid-template-columns:1fr;
  }

  .sidebar{
    order:2;
  }

  .theme-list{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    max-height:none;
  }

  .theme{
    grid-template-columns:50px 1fr;
  }

  .theme img{
    width:46px;
    height:46px;
  }

  .controls{
    grid-template-columns:1fr;
  }

}


@media(max-width:720px){

  .topbar{
    grid-template-columns:1fr;
  }

  .tools{
    justify-self:center;
  }

  .top-actions{
    justify-content:center;
  }

  .timer-card{
    left:7%;
    right:7%;
    top:auto;
    bottom:8%;
    width:86%;
  }

  .theme-list{
    grid-template-columns:repeat(2,1fr);
  }

  .quick{
    grid-template-columns:repeat(4,1fr);
  }

  .actions{
    flex-wrap:wrap;
  }

  .action{
    min-width:170px;
  }

}
</style>
</head>


<body>

<div class="page">


<header class="topbar">

  <button
    class="top-btn tools"
    id="toolsBtn">
    ⌂ Tools
  </button>


  <div class="brand">

    <h1>
      Timer
    </h1>

    <p>
      Pick a time, pick a theme, and let's go.
    </p>

  </div>


  <div class="top-actions">

    <button
      class="top-btn"
      id="soundBtn">
      🔊 Sound
    </button>


    <button
      class="top-btn"
      id="settingsBtn">
      ⚙ Settings
    </button>

  </div>

</header>



<div class="layout">


<aside class="sidebar">

  <h2>
    THEMES
  </h2>


  <div
    class="theme-list"
    id="themeList">


    <button
      class="theme active"
      data-theme="fall">

      <img
        src="timer-images/fall-thumb.png"
        alt="">

      <span>
        Fall Leaves
      </span>

    </button>


    <button
      class="theme"
      data-theme="ocean">

      <img
        src="timer-images/ocean-thumb.png"
        alt="">

      <span>
        Ocean
      </span>

    </button>


    <button
      class="theme"
      data-theme="snow">

      <img
        src="timer-images/snow-thumb.png"
        alt="">

      <span>
        Snow
      </span>

    </button>


    <button
      class="theme"
      data-theme="spring">

      <img
        src="timer-images/spring-thumb.png"
        alt="">

      <span>
        Spring Garden
      </span>

    </button>


    <button
      class="theme"
      data-theme="rain">

      <img
        src="timer-images/rain-thumb.png"
        alt="">

      <span>
        Rain
      </span>

    </button>


    <button
      class="theme"
      data-theme="fireplace">

      <img
        src="timer-images/fireplace-thumb.png"
        alt="">

      <span>
        Fireplace
      </span>

    </button>


    <button
      class="theme"
      data-theme="beach">

      <img
        src="timer-images/beach-thumb.png"
        alt="">

      <span>
        Beach
      </span>

    </button>


    <button
      class="theme"
      data-theme="bubbles">

      <img
        src="timer-images/bubbles-thumb.png"
        alt="">

      <span>
        Bubbles
      </span>

    </button>


    <button
      class="theme"
      data-theme="balloon">

      <img
        src="timer-images/balloon-thumb.png"
        alt="">

      <span>
        Balloon
      </span>

    </button>


    <button
      class="theme"
      data-theme="rocket">

      <img
        src="timer-images/rocket-thumb.png"
        alt="">

      <span>
        Rocket
      </span>

    </button>


    <button
      class="theme"
      data-theme="coaster">

      <img
        src="timer-images/coaster-thumb.png"
        alt="">

      <span>
        Roller Coaster
      </span>

    </button>


  </div>

</aside>



<main>


<section
  class="scene"
  id="scene">


  <div
    class="scene-bg"
    id="sceneBg">
  </div>


  <div class="scene-shade"></div>


  <div
    class="fx"
    id="fx">
  </div>



  <div class="timer-card">

    <div
      class="time"
      id="timeText">
      05:00
    </div>


    <div
      class="time-label"
      id="timeLabel">
      5 minutes
    </div>


    <div class="progress">

      <div id="progressFill"></div>

    </div>

  </div>


  <button
    class="full"
    id="fullBtn">
    ⛶
  </button>


</section>



<div class="controls">


<section class="panel">

  <div class="panel-title">
    QUICK SET
  </div>


  <div
    class="quick"
    id="quickSet">


    <button data-min="1">
      1
      <small>min</small>
    </button>


    <button data-min="3">
      3
      <small>min</small>
    </button>


    <button
      class="active"
      data-min="5">
      5
      <small>min</small>
    </button>


    <button data-min="10">
      10
      <small>min</small>
    </button>


    <button data-min="15">
      15
      <small>min</small>
    </button>


    <button data-min="20">
      20
      <small>min</small>
    </button>


    <button data-min="30">
      30
      <small>min</small>
    </button>


  </div>

</section>



<section class="panel">

  <div class="panel-title">
    SET YOUR OWN TIME
  </div>


  <div class="custom">


    <button
      class="round"
      id="minusBtn">
      −
    </button>


    <div class="custom-display">

      <div>

        <span id="customText">
          05:00
        </span>

        <small>
          MM:SS
        </small>

      </div>

    </div>


    <button
      class="round"
      id="plusBtn">
      +
    </button>


  </div>

</section>


</div>



<div class="actions">


  <button
    class="action start"
    id="startBtn">
    ▶ Start
  </button>


  <button
    class="action pause"
    id="pauseBtn">
    ❚❚ Pause
  </button>


  <button
    class="action reset"
    id="resetBtn">
    ↻ Reset
  </button>


</div>


</main>

</div>

</div>



<script>

const ASSET =
  "timer-images/";


const themes = {

  fall:{
    bg:"fall.png"
  },

  ocean:{
    bg:"ocean.png"
  },

  snow:{
    bg:"snow.png"
  },

  spring:{
    bg:"spring.png"
  },

  rain:{
    bg:"rain.png"
  },

  fireplace:{
    bg:"fireplace.png"
  },

  beach:{
    bg:"beach.png"
  },

  bubbles:{
    bg:"bubbles.png"
  },

  balloon:{
    bg:"balloon.png"
  },

  rocket:{
    bg:"rocket.png"
  },

  coaster:{
    bg:"coaster.png"
  }

};



let currentTheme =
  localStorage.getItem(
    "classroomTimerTheme"
  ) || "fall";


let totalSeconds =
  Number(
    localStorage.getItem(
      "classroomTimerMinutes"
    ) || 5
  ) * 60;


let remainingSeconds =
  totalSeconds;


let timerId =
  null;


let soundOn =
  localStorage.getItem(
    "classroomTimerSound"
  ) !== "off";



const sceneBg =
  document.getElementById(
    "sceneBg"
  );


const fx =
  document.getElementById(
    "fx"
  );


const timeText =
  document.getElementById(
    "timeText"
  );


const customText =
  document.getElementById(
    "customText"
  );


const timeLabel =
  document.getElementById(
    "timeLabel"
  );


const progressFill =
  document.getElementById(
    "progressFill"
  );


const soundBtn =
  document.getElementById(
    "soundBtn"
  );



function fmt(sec){

  const m =
    Math.floor(
      sec / 60
    );

  const s =
    sec % 60;


  return (
    String(m)
      .padStart(2,"0")
    +
    ":"
    +
    String(s)
      .padStart(2,"0")
  );

}



function pct(){

  return totalSeconds
    ? remainingSeconds /
      totalSeconds
    : 0;

}



function updateDisplay(){

  timeText.textContent =
    fmt(
      remainingSeconds
    );


  customText.textContent =
    fmt(
      totalSeconds
    );


  const mins =
    Math.ceil(
      remainingSeconds /
      60
    );


  timeLabel.textContent =
    remainingSeconds === 0
      ? "Time's up!"
      : `${mins} ${
          mins === 1
            ? "minute"
            : "minutes"
        }`;


  progressFill.style.width =
    (
      pct() * 100
    ) + "%";


  updateTimeBasedVisual();

}



function setMinutes(m){

  stop();


  totalSeconds =
    Math.max(
      60,
      m * 60
    );


  remainingSeconds =
    totalSeconds;


  localStorage.setItem(
    "classroomTimerMinutes",
    Math.round(
      totalSeconds / 60
    )
  );


  document
    .querySelectorAll(
      "#quickSet button"
    )
    .forEach(
      b =>
        b.classList.toggle(
          "active",
          Number(
            b.dataset.min
          ) === m
        )
    );


  updateDisplay();

}



function stop(){

  clearInterval(
    timerId
  );


  timerId =
    null;

}



function start(){

  if(timerId){
    return;
  }


  if(
    remainingSeconds <= 0
  ){

    remainingSeconds =
      totalSeconds;

  }


  timerId =
    setInterval(
      () => {

        remainingSeconds--;


        if(
          remainingSeconds <= 0
        ){

          remainingSeconds = 0;

          updateDisplay();

          stop();

          chime();

          return;

        }


        updateDisplay();

      },
      1000
    );

}



function loadTheme(name){

  currentTheme =
    name;


  localStorage.setItem(
    "classroomTimerTheme",
    name
  );


  sceneBg.style.backgroundImage =
    `url("${ASSET}${themes[name].bg}")`;


  document
    .querySelectorAll(
      ".theme"
    )
    .forEach(
      b =>
        b.classList.toggle(
          "active",
          b.dataset.theme === name
        )
    );


  buildFx();

  updateDisplay();

}



function buildFx(){

  fx.innerHTML =
    "";


  if(
    currentTheme === "fall"
  ){

    for(
      let i = 0;
      i < 18;
      i++
    ){

      const e =
        document.createElement(
          "div"
        );


      e.className =
        "leaf " +
        (
          i % 3 === 0
            ? "red"
            :
          i % 3 === 1
            ? "gold"
            : ""
        );


      e.style.left =
        (
          10 +
          Math.random() * 72
        ) + "%";


      e.style.animationDuration =
        (
          6 +
          Math.random() * 7
        ) + "s";


      e.style.animationDelay =
        (
          -Math.random() * 10
        ) + "s";


      fx.appendChild(e);

    }

  }



  if(
    currentTheme === "ocean" ||
    currentTheme === "beach"
  ){

    for(
      let i = 0;
      i < 4;
      i++
    ){

      const fish =
        document.createElement(
          "div"
        );


      fish.className =
        "fish";


      fish.style.backgroundImage =
        `url("${ASSET}fish-${(i % 3) + 1}.png")`;


      fish.style.top =
        (
          18 +
          i * 15
        ) + "%";


      fish.style.animationDuration =
        (
          12 +
          i * 4
        ) + "s";


      fish.style.animationDelay =
        (
          -i * 5
        ) + "s";


      fx.appendChild(
        fish
      );

    }


    for(
      let i = 0;
      i < 18;
      i++
    ){

      const b =
        document.createElement(
          "div"
        );


      b.className =
        "bubble";


      const s =
        8 +
        Math.random() * 20;


      b.style.width =
        s + "px";


      b.style.height =
        s + "px";


      b.style.left =
        (
          4 +
          Math.random() * 88

function updateTimeBasedVisual(){

  const p =
    pct();


  if(
    currentTheme === "bubbles"
  ){

    const bubbles =
      [
        ...document.querySelectorAll(
          ".timerBubble"
        )
      ];


    const keep =
      Math.ceil(
        bubbles.length *
        p
      );


    bubbles.forEach(
      (b,i) =>
        b.style.opacity =
          i < keep
            ? "1"
            : "0"
    );

  }



  const traveler =
    document.getElementById(
      "traveler"
    );


  if(!traveler){
    return;
  }


  const done =
    1 - p;



  if(
    currentTheme === "balloon"
  ){

    traveler.style.transform =
      `translate(
        ${done * 250}px,
        ${done * 360}px
      )`;

  }

  else if(
    currentTheme === "rocket"
  ){

    traveler.style.transform =
      `translate(
        ${done * 640}px,
        ${-done * 330}px
      )
      rotate(
        ${done * 10}deg
      )`;

  }

  else if(
    currentTheme === "coaster"
  ){

    traveler.style.transform =
      `translateX(
        ${done * 650}px
      )
      translateY(
        ${
          -Math.sin(
            done *
            Math.PI
          ) *
          100
        }px
      )`;

  }

}



function chime(){

  if(!soundOn){
    return;
  }


  const AC =
    window.AudioContext ||
    window.webkitAudioContext;


  if(!AC){
    return;
  }


  const ctx =
    new AC();


  [
    523.25,
    659.25,
    783.99
  ]
  .forEach(
    (f,i) => {

      const o =
        ctx.createOscillator();


      const g =
        ctx.createGain();


      const t =
        ctx.currentTime +
        i * .22;


      o.type =
        "sine";


      o.frequency.value =
        f;


      g.gain.setValueAtTime(
        .001,
        t
      );


      g.gain
        .exponentialRampToValueAtTime(
          .13,
          t + .03
        );


      g.gain
        .exponentialRampToValueAtTime(
          .001,
          t + .65
        );


      o.connect(g);


      g.connect(
        ctx.destination
      );


      o.start(t);


      o.stop(
        t + .7
      );

    }
  );


  setTimeout(
    () =>
      ctx.close()
        .catch(
          () => {}
        ),
    1800
  );

}
