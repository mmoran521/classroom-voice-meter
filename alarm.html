<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Classroom Alarms</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --navy: #26384f;
  --muted: #748195;
  --border: #e3e9f0;
  --background: #f6f8fb;
  --card: #ffffff;

  --blue: #7f9fe3;
  --blue-light: #eef3ff;

  --teal: #67bea8;
  --teal-light: #eaf8f4;

  --pink: #df879c;
  --pink-light: #fceef2;

  --purple: #9488d7;
  --purple-light: #f1effb;

  --red: #df7479;
}

body {
  margin: 0;
  min-height: 100vh;

  font-family:
    "Trebuchet MS",
    Arial,
    sans-serif;

  color: var(--navy);

  background:
    radial-gradient(circle at top left, #edf3ff, transparent 35%),
    radial-gradient(circle at bottom right, #ebf8f5, transparent 35%),
    var(--background);
}

button,
input,
select {
  font: inherit;
}

.page {
  width: min(1050px, calc(100% - 32px));
  margin: 0 auto;
  padding: 24px 0 50px;
}


/* =========================================
   TOP BAR
========================================= */

.topbar {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;

  margin-bottom: 28px;
}

.tools-button {
  justify-self: start;

  border: 1px solid var(--border);
  background: white;

  padding: 11px 17px;
  border-radius: 15px;

  color: var(--navy);
  font-weight: 800;

  cursor: pointer;

  box-shadow: 0 4px 12px rgba(50,65,85,.06);
}

.heading {
  text-align: center;
}

.heading h1 {
  margin: 0;

  font-size: clamp(36px,5vw,50px);
  letter-spacing: -1px;
}

.heading p {
  margin: 5px 0 0;

  color: var(--muted);
  font-size: 16px;
}


/* =========================================
   MAIN HEADER
========================================= */

.alarm-header {
  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 20px;

  margin-bottom: 16px;
}

.section-title {
  font-size: 19px;
  font-weight: 900;
}

.add-button {
  border: 0;

  background: var(--teal);
  color: white;

  padding: 12px 20px;
  border-radius: 15px;

  font-weight: 900;

  cursor: pointer;

  box-shadow:
    0 6px 15px rgba(78,167,145,.18);
}

.add-button:hover {
  transform: translateY(-1px);
}


/* =========================================
   EMPTY
========================================= */

.empty-state {
  background: white;

  border: 1px solid var(--border);
  border-radius: 25px;

  padding: 60px 25px;

  text-align: center;

  color: var(--muted);

  box-shadow:
    0 8px 24px rgba(50,65,85,.05);
}

.empty-icon {
  font-size: 45px;
  margin-bottom: 8px;
}

.empty-title {
  color: var(--navy);

  font-size: 21px;
  font-weight: 900;

  margin-bottom: 5px;
}


/* =========================================
   ALARM LIST
========================================= */

.alarm-list {
  display: flex;
  flex-direction: column;

  gap: 12px;
}

.alarm-card {
  display: grid;

  grid-template-columns:
    160px
    1fr
    auto;

  align-items: center;

  gap: 22px;

  background: white;

  border: 1px solid var(--border);
  border-radius: 22px;

  padding: 18px 20px;

  box-shadow:
    0 6px 20px rgba(50,65,85,.055);
}

.alarm-card.off {
  opacity: .57;
}

.alarm-time {
  font-size: 30px;
  font-weight: 900;

  letter-spacing: -1px;
}

.alarm-label {
  font-size: 18px;
  font-weight: 900;

  margin-bottom: 5px;
}

.alarm-info {
  color: var(--muted);

  font-size: 14px;
}

.alarm-actions {
  display: flex;

  align-items: center;
  gap: 9px;
}

.edit-button,
.delete-button {
  border: 1px solid var(--border);
  background: #f9fafc;

  border-radius: 12px;
  padding: 9px 12px;

  color: #627085;

  font-weight: 800;
  cursor: pointer;
}

.delete-button:hover {
  color: var(--red);
}


/* =========================================
   SWITCH
========================================= */

.switch {
  position: relative;

  width: 53px;
  height: 30px;

  flex: 0 0 auto;
}

.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.slider {
  position: absolute;

  inset: 0;

  background: #dce3eb;

  border-radius: 999px;

  cursor: pointer;

  transition: .2s;
}

.slider:before {
  content: "";

  position: absolute;

  width: 22px;
  height: 22px;

  left: 4px;
  top: 4px;

  background: white;

  border-radius: 50%;

  box-shadow:
    0 2px 6px rgba(40,55,75,.18);

  transition: .2s;
}

.switch input:checked + .slider {
  background: var(--teal);
}

.switch input:checked + .slider:before {
  transform: translateX(23px);
}


/* =========================================
   MODAL
========================================= */

.modal-backdrop {
  display: none;

  position: fixed;
  inset: 0;

  z-index: 100;

  padding: 20px;

  background:
    rgba(38,51,70,.35);

  backdrop-filter:
    blur(5px);

  overflow-y: auto;
}

.modal-backdrop.open {
  display: flex;

  justify-content: center;
  align-items: flex-start;
}

.modal {
  width: min(570px,100%);

  background: white;

  border-radius: 28px;

  margin: 35px auto;

  padding: 25px;

  box-shadow:
    0 25px 70px rgba(30,45,65,.25);
}

.modal-top {
  display: flex;

  justify-content: space-between;
  align-items: center;

  margin-bottom: 22px;
}

.modal-title {
  font-size: 25px;
  font-weight: 900;
}

.close-button {
  width: 40px;
  height: 40px;

  border: 0;

  border-radius: 50%;

  background: #f1f4f8;

  color: #6d7888;

  font-size: 20px;

  cursor: pointer;
}


/* =========================================
   FORM
========================================= */

.field {
  margin-bottom: 19px;
}

.field label.field-label {
  display: block;

  margin-bottom: 8px;

  font-size: 14px;
  font-weight: 900;
}

.time-input {
  width: 100%;

  padding: 15px 16px;

  border: 1px solid var(--border);
  border-radius: 15px;

  background: #f9fafc;

  color: var(--navy);

  font-size: 28px;
  font-weight: 900;
}

.text-input,
.select-input {
  width: 100%;

  padding: 13px 14px;

  border: 1px solid var(--border);
  border-radius: 14px;

  background: #f9fafc;

  color: var(--navy);

  font-size: 16px;
}

.text-input:focus,
.select-input:focus,
.time-input:focus {
  outline: 3px solid rgba(127,159,227,.18);
  border-color: var(--blue);
}


/* =========================================
   REPEAT
========================================= */

.repeat-options {
  display: grid;

  grid-template-columns:
    repeat(2,1fr);

  gap: 8px;
}

.repeat-option {
  border: 2px solid transparent;

  background: #f6f8fb;

  color: var(--navy);

  padding: 11px 9px;

  border-radius: 13px;

  font-weight: 800;

  cursor: pointer;
}

.repeat-option.selected {
  border-color: var(--blue);
  background: var(--blue-light);
  color: #5976bb;
}


/* =========================================
   DAYS
========================================= */

.custom-days {
  display: none;

  margin-top: 13px;
}

.custom-days.show {
  display: block;
}

.day-buttons {
  display: grid;

  grid-template-columns:
    repeat(7,1fr);

  gap: 6px;
}

.day-button {
  aspect-ratio: 1;

  border: 1px solid var(--border);

  background: white;

  border-radius: 50%;

  cursor: pointer;

  font-weight: 900;

  color: #677487;
}

.day-button.selected {
  background: var(--purple);
  border-color: var(--purple);

  color: white;
}


/* =========================================
   SOUND
========================================= */

.sound-grid {
  display: grid;

  grid-template-columns:
    1fr 47px;

  gap: 8px;

  align-items: center;
}

.preview-sound {
  border: 1px solid var(--border);

  background: var(--blue-light);
  color: #5c75b4;

  border-radius: 12px;

  cursor: pointer;

  font-size: 18px;
}


/* =========================================
   FORM BUTTONS
========================================= */

.modal-actions {
  display: flex;

  justify-content: flex-end;
  gap: 9px;

  margin-top: 25px;
}

.cancel-button {
  border: 1px solid var(--border);

  background: white;
  color: #657286;

  padding: 12px 18px;

  border-radius: 14px;

  font-weight: 800;

  cursor: pointer;
}

.save-button {
  border: 0;

  background: var(--teal);
  color: white;

  padding: 12px 21px;

  border-radius: 14px;

  font-weight: 900;

  cursor: pointer;
}


/* =========================================
   ACTIVE ALARM
========================================= */

.ringing-overlay {
  display: none;

  position: fixed;
  inset: 0;

  z-index: 500;

  background:
    linear-gradient(
      135deg,
      rgba(238,243,255,.97),
      rgba(233,249,245,.97)
    );

  align-items: center;
  justify-content: center;

  padding: 25px;
}

.ringing-overlay.show {
  display: flex;
}

.ringing-card {
  width: min(650px,100%);

  text-align: center;

  background: white;

  border-radius: 35px;

  padding: 50px 30px;

  box-shadow:
    0 25px 70px rgba(38,55,80,.20);
}

.ringing-icon {
  font-size: 74px;
}

.ringing-label {
  font-size: clamp(38px,7vw,66px);
  font-weight: 900;

  margin-top: 12px;
}

.ringing-time {
  color: var(--muted);

  font-size: 23px;

  margin-top: 8px;
}

.stop-alarm {
  margin-top: 30px;

  min-width: 220px;

  border: 0;

  background: var(--pink);
  color: white;

  padding: 17px 30px;

  border-radius: 18px;

  font-size: 22px;
  font-weight: 900;

  cursor: pointer;

  box-shadow:
    0 8px 20px rgba(220,120,145,.22);
}


/* =========================================
   RESPONSIVE
========================================= */

@media(max-width:720px) {

  .topbar {
    grid-template-columns: 1fr;
    gap: 12px;

    text-align: center;
  }

  .tools-button {
    justify-self: center;
    order: 2;
  }

  .heading {
    order: 1;
  }

  .alarm-card {
    grid-template-columns: 1fr;
    gap: 12px;
  }

  .alarm-actions {
    justify-content: flex-start;
    flex-wrap: wrap;
  }

}

</style>
</head>


<body>

<div class="page">

  <header class="topbar">

    <button
      class="tools-button"
      type="button"
      id="toolsButton">
      ⌂ Tools
    </button>

    <div class="heading">
      <h1>Alarm</h1>
      <p>Classroom reminders that remember.</p>
    </div>

    <div></div>

  </header>


  <div class="alarm-header">

    <div class="section-title">
      Saved Alarms
    </div>

    <button
      id="addAlarmButton"
      class="add-button"
      type="button">
      + Add Alarm
    </button>

  </div>


  <main>

    <div
      id="emptyState"
      class="empty-state">

      <div class="empty-icon">
        🔔
      </div>

      <div class="empty-title">
        No alarms yet
      </div>

      <div>
        Add your classroom reminders once and they'll stay saved here.
      </div>

    </div>


    <div
      id="alarmList"
      class="alarm-list">
    </div>

  </main>

</div>


<!-- =======================================
     ADD / EDIT MODAL
======================================= -->

<div
  id="alarmModal"
  class="modal-backdrop">

  <div
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalTitle">

    <div class="modal-top">

      <div
        id="modalTitle"
        class="modal-title">
        Add Alarm
      </div>

      <button
        id="closeModalButton"
        class="close-button"
        type="button">
        ×
      </button>

    </div>


    <div class="field">

      <label
        for="alarmTime"
        class="field-label">
        Time
      </label>

      <input
        id="alarmTime"
        class="time-input"
        type="time"
        value="09:30">

    </div>


    <div class="field">

      <label
        for="alarmLabel"
        class="field-label">
        Label
      </label>

      <input
        id="alarmLabel"
        class="text-input"
        type="text"
        maxlength="50"
        placeholder="Example: Lunch">

    </div>


    <div class="field">

      <div class="field-label">
        Repeat
      </div>

      <div class="repeat-options">

        <button
          type="button"
          class="repeat-option"
          data-repeat="once">
          Once
        </button>

        <button
          type="button"
          class="repeat-option"
          data-repeat="daily">
          Every Day
        </button>

        <button
          type="button"
          class="repeat-option selected"
          data-repeat="weekdays">
          Weekdays
        </button>

        <button
          type="button"
          class="repeat-option"
          data-repeat="custom">
          Custom Days
        </button>

      </div>


      <div
        id="customDays"
        class="custom-days">

        <div class="day-buttons">

          <button type="button" class="day-button" data-day="1">M</button>
          <button type="button" class="day-button" data-day="2">T</button>
          <button type="button" class="day-button" data-day="3">W</button>
          <button type="button" class="day-button" data-day="4">T</button>
          <button type="button" class="day-button" data-day="5">F</button>
          <button type="button" class="day-button" data-day="6">S</button>
          <button type="button" class="day-button" data-day="0">S</button>

        </div>

      </div>

    </div>


    <div class="field">

      <label
        for="alarmSound"
        class="field-label">
        Sound
      </label>

      <div class="sound-grid">

        <select
          id="alarmSound"
          class="select-input">

          <option value="gentle">
            Gentle Chime
          </option>

          <option value="happy">
            Happy Bell
          </option>

          <option value="school">
            School Bell
          </option>

          <option value="chimes">
            Chimes
          </option>

          <option value="beep">
            Beep Beep
          </option>

        </select>

        <button
          id="previewSoundButton"
          class="preview-sound"
          type="button"
          title="Preview sound">
          ▶
        </button>

      </div>

    </div>


    <div class="modal-actions">

      <button
        id="cancelButton"
        class="cancel-button"
        type="button">
        Cancel
      </button>

      <button
        id="saveAlarmButton"
        class="save-button"
        type="button">
        Save Alarm
      </button>

    </div>

  </div>

</div>


<!-- =======================================
     RINGING SCREEN
======================================= -->

<div
  id="ringingOverlay"
  class="ringing-overlay">

  <div class="ringing-card">

    <div class="ringing-icon">
      🔔
    </div>

    <div
      id="ringingLabel"
      class="ringing-label">
      Alarm
    </div>

    <div
      id="ringingTime"
      class="ringing-time">
    </div>

    <button
      id="stopAlarmButton"
      class="stop-alarm"
      type="button">
      STOP
    </button>

  </div>

</div>


<script>

/* =========================================
   STORAGE
========================================= */

const STORAGE_KEY =
  "classroomSavedAlarmsV1";

let alarms = [];

let editingId = null;

let selectedRepeat =
  "weekdays";

let selectedDays = [];

let ringingInterval = null;

let activeAudioContexts = [];


/* =========================================
   ELEMENTS
========================================= */

const alarmList =
  document.getElementById(
    "alarmList"
  );

const emptyState =
  document.getElementById(
    "emptyState"
  );

const modal =
  document.getElementById(
    "alarmModal"
  );

const modalTitle =
  document.getElementById(
    "modalTitle"
  );

const alarmTime =
  document.getElementById(
    "alarmTime"
  );

const alarmLabel =
  document.getElementById(
    "alarmLabel"
  );

const alarmSound =
  document.getElementById(
    "alarmSound"
  );

const customDays =
  document.getElementById(
    "customDays"
  );

const ringingOverlay =
  document.getElementById(
    "ringingOverlay"
  );

const ringingLabel =
  document.getElementById(
    "ringingLabel"
  );

const ringingTime =
  document.getElementById(
    "ringingTime"
  );


/* =========================================
   LOAD
========================================= */

function loadAlarms() {

  try {

    const saved =
      localStorage.getItem(
        STORAGE_KEY
      );

    alarms =
      saved
        ? JSON.parse(saved)
        : [];

  }

  catch {

    alarms = [];

  }

}


function saveAlarms() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(alarms)
  );

}


/* =========================================
   TIME DISPLAY
========================================= */

function formatTime12Hour(
  time
) {

  const parts =
    time.split(":");

  let hour =
    Number(parts[0]);

  const minute =
    parts[1];

  const suffix =
    hour >= 12
      ? "PM"
      : "AM";

  hour =
    hour % 12;

  if (
    hour === 0
  ) {

    hour = 12;

  }

  return (
    hour +
    ":" +
    minute +
    " " +
    suffix
  );

}


/* =========================================
   REPEAT LABEL
========================================= */

function repeatLabel(
  alarm
) {

  if (
    alarm.repeat ===
    "once"
  ) {

    return "Once";

  }


  if (
    alarm.repeat ===
    "daily"
  ) {

    return "Every day";

  }


  if (
    alarm.repeat ===
    "weekdays"
  ) {

    return "Weekdays";

  }


  const shortNames = {
    0: "Sun",
    1: "Mon",
    2: "Tue",
    3: "Wed",
    4: "Thu",
    5: "Fri",
    6: "Sat"
  };


  return alarm.days
    .map(
      day =>
        shortNames[day]
    )
    .join(", ");

}


/* =========================================
   SOUND LABEL
========================================= */

function soundLabel(
  sound
) {

  const sounds = {
    gentle: "Gentle Chime",
    happy: "Happy Bell",
    school: "School Bell",
    chimes: "Chimes",
    beep: "Beep Beep"
  };

  return (
    sounds[sound] ||
    "Gentle Chime"
  );

}


/* =========================================
   RENDER
========================================= */

function renderAlarms() {

  alarmList.innerHTML =
    "";


  emptyState.style.display =
    alarms.length
      ? "none"
      : "block";


  alarms
    .sort(
      (a,b) =>
        a.time.localeCompare(
          b.time
        )
    )
    .forEach(
      alarm => {

        const card =
          document.createElement(
            "div"
          );

        card.className =
          "alarm-card" +
          (
            alarm.enabled
              ? ""
              : " off"
          );


        card.innerHTML = `

          <div class="alarm-time">
            ${formatTime12Hour(alarm.time)}
          </div>

          <div>

            <div class="alarm-label">
              ${escapeHTML(
                alarm.label ||
                "Alarm"
              )}
            </div>

            <div class="alarm-info">
              ${repeatLabel(alarm)}
              ·
              ${soundLabel(alarm.sound)}
            </div>

          </div>

          <div class="alarm-actions">

            <label class="switch">

              <input
                type="checkbox"
                ${alarm.enabled ? "checked" : ""}
                data-toggle="${alarm.id}">

              <span class="slider"></span>

            </label>

            <button
              class="edit-button"
              type="button"
              data-edit="${alarm.id}">
              Edit
            </button>

            <button
              class="delete-button"
              type="button"
              data-delete="${alarm.id}">
              Delete
            </button>

          </div>

        `;


        alarmList.appendChild(
          card
        );

      }
    );


  bindAlarmCardEvents();

}


/* =========================================
   CARD EVENTS
========================================= */

function bindAlarmCardEvents() {

  document
    .querySelectorAll(
      "[data-toggle]"
    )
    .forEach(
      checkbox => {

        checkbox.addEventListener(
          "change",
          () => {

            const alarm =
              alarms.find(
                item =>
                  item.id ===
                  checkbox.dataset.toggle
              );

            if (
              alarm
            ) {

              alarm.enabled =
                checkbox.checked;

              saveAlarms();
              renderAlarms();

            }

          }
        );

      }
    );


  document
    .querySelectorAll(
      "[data-edit]"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            openEditAlarm(
              button.dataset.edit
            );

          }
        );

      }
    );


  document
    .querySelectorAll(
      "[data-delete]"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            alarms =
              alarms.filter(
                alarm =>
                  alarm.id !==
                  button.dataset.delete
              );

            saveAlarms();
            renderAlarms();

          }
        );

      }
    );

}


/* =========================================
   ADD
========================================= */

document
  .getElementById(
    "addAlarmButton"
  )
  .addEventListener(
    "click",
    openAddAlarm
  );


function openAddAlarm() {

  editingId = null;

  modalTitle.textContent =
    "Add Alarm";

  alarmTime.value =
    defaultAlarmTime();

  alarmLabel.value =
    "";

  alarmSound.value =
    "gentle";

  selectedRepeat =
    "weekdays";

  selectedDays =
    [1,2,3,4,5];

  updateRepeatUI();

  modal.classList.add(
    "open"
  );

}


/* =========================================
   DEFAULT TIME
========================================= */

function defaultAlarmTime() {

  const now =
    new Date();

  now.setMinutes(
    now.getMinutes() + 5
  );

  return (
    String(
      now.getHours()
    ).padStart(2,"0")
    +
    ":"
    +
    String(
      now.getMinutes()
    ).padStart(2,"0")
  );

}


/* =========================================
   EDIT
========================================= */

function openEditAlarm(
  id
) {

  const alarm =
    alarms.find(
      item =>
        item.id === id
    );

  if (
    !alarm
  ) {

    return;

  }


  editingId =
    alarm.id;

  modalTitle.textContent =
    "Edit Alarm";

  alarmTime.value =
    alarm.time;

  alarmLabel.value =
    alarm.label || "";

  alarmSound.value =
    alarm.sound || "gentle";

  selectedRepeat =
    alarm.repeat;

  selectedDays =
    Array.isArray(
      alarm.days
    )
      ? [...alarm.days]
      : [];

  updateRepeatUI();

  modal.classList.add(
    "open"
  );

}


/* =========================================
   REPEAT
========================================= */

document
  .querySelectorAll(
    ".repeat-option"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          selectedRepeat =
            button.dataset.repeat;

          if (
            selectedRepeat ===
            "weekdays"
          ) {

            selectedDays =
              [1,2,3,4,5];

          }

          updateRepeatUI();

        }
      );

    }
  );


function updateRepeatUI() {

  document
    .querySelectorAll(
      ".repeat-option"
    )
    .forEach(
      button => {

        button
          .classList
          .toggle(
            "selected",
            button.dataset.repeat ===
            selectedRepeat
          );

      }
    );


  customDays
    .classList
    .toggle(
      "show",
      selectedRepeat ===
      "custom"
    );


  document
    .querySelectorAll(
      ".day-button"
    )
    .forEach(
      button => {

        const day =
          Number(
            button.dataset.day
          );

        button
          .classList
          .toggle(
            "selected",
            selectedDays.includes(
              day
            )
          );

      }
    );

}


/* =========================================
   CUSTOM DAYS
========================================= */

document
  .querySelectorAll(
    ".day-button"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          const day =
            Number(
              button.dataset.day
            );

          if (
            selectedDays.includes(
              day
            )
          ) {

            selectedDays =
              selectedDays.filter(
                item =>
                  item !== day
              );

          }

          else {

            selectedDays.push(
              day
            );

          }

          updateRepeatUI();

        }
      );

    }
  );


/* =========================================
   SAVE
========================================= */

document
  .getElementById(
    "saveAlarmButton"
  )
  .addEventListener(
    "click",
    saveAlarmFromForm
  );


function saveAlarmFromForm() {

  if (
    !alarmTime.value
  ) {

    alert(
      "Choose an alarm time."
    );

    return;

  }


  if (
    selectedRepeat ===
    "custom" &&
    selectedDays.length === 0
  ) {

    alert(
      "Choose at least one day."
    );

    return;

  }


  if (
    editingId
  ) {

    const alarm =
      alarms.find(
        item =>
          item.id ===
          editingId
      );

    if (
      alarm
    ) {

      alarm.time =
        alarmTime.value;

      alarm.label =
        alarmLabel.value.trim();

      alarm.sound =
        alarmSound.value;

      alarm.repeat =
        selectedRepeat;

      alarm.days =
        [...selectedDays];

      alarm.lastTriggered =
        "";

    }

  }

  else {

    alarms.push({

      id:
        "alarm_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .slice(2,7),

      time:
        alarmTime.value,

      label:
        alarmLabel.value.trim(),

      sound:
        alarmSound.value,

      repeat:
        selectedRepeat,

      days:
        [...selectedDays],

      enabled:
        true,

      lastTriggered:
        "",

      createdDate:
        getDateKey(
          new Date()
        )

    });

  }


  saveAlarms();

  closeModal();

  renderAlarms();

}

   MODAL CLOSE

/* =========================================
   CHECK ALARMS
========================================= */

function checkAlarms() {

  const now =
    new Date();

  const currentTime =
    String(
      now.getHours()
    ).padStart(2,"0")
    +
    ":"
    +
    String(
      now.getMinutes()
    ).padStart(2,"0");


  const dateKey =
    getDateKey(now);

  const day =
    now.getDay();


  alarms.forEach(
    alarm => {

      if (
        !alarm.enabled
      ) {

        return;

      }


      if (
        alarm.time !==
        currentTime
      ) {

        return;

      }


      if (
        alarm.lastTriggered ===
        dateKey
      ) {

        return;

      }


      if (
        !alarmRunsToday(
          alarm,
          day,
          dateKey
        )
      ) {

        return;

      }


      alarm.lastTriggered =
        dateKey;


      if (
        alarm.repeat ===
        "once"
      ) {

        alarm.enabled =
          false;

      }


      saveAlarms();

      renderAlarms();

      triggerAlarm(
        alarm
      );

    }
  );

}


/* =========================================
   SHOULD RUN TODAY?
========================================= */

function alarmRunsToday(
  alarm,
  day,
  dateKey
) {

  if (
    alarm.repeat ===
    "daily"
  ) {

    return true;

  }


  if (
    alarm.repeat ===
    "weekdays"
  ) {

    return (
      day >= 1 &&
      day <= 5
    );

  }


  if (
    alarm.repeat ===
    "custom"
  ) {

    return alarm.days
      .includes(day);

  }


  if (
    alarm.repeat ===
    "once"
  ) {

    return (
      !alarm.createdDate ||
      dateKey >=
      alarm.createdDate
    );

  }


  return false;

}


/* =========================================
   TRIGGER
========================================= */

function triggerAlarm(
  alarm
) {

  ringingLabel.textContent =
    alarm.label ||
    "Alarm";

  ringingTime.textContent =
    formatTime12Hour(
      alarm.time
    );

  ringingOverlay
    .classList
    .add("show");


  playAlarmSound(
    alarm.sound,
    true
  );


  clearInterval(
    ringingInterval
  );


  ringingInterval =
    setInterval(
      () => {

        playAlarmSound(
          alarm.sound,
          true
        );

      },
      3200
    );

}


/* =========================================
   STOP
========================================= */

document
  .getElementById(
    "stopAlarmButton"
  )
  .addEventListener(
    "click",
    stopRinging
  );


function stopRinging() {

  ringingOverlay
    .classList
    .remove("show");


  clearInterval(
    ringingInterval
  );

  ringingInterval =
    null;


  activeAudioContexts
    .forEach(
      context => {

        try {
          context.close();
        }
        catch {}

      }
    );


  activeAudioContexts = [];

}


/* =========================================
   SOUNDS
========================================= */

function playAlarmSound(
  sound,
  ringing
) {

  const AudioCtx =
    window.AudioContext ||
    window.webkitAudioContext;


  if (
    !AudioCtx
  ) {

    return;

  }


  const ctx =
    new AudioCtx();

  activeAudioContexts.push(
    ctx
  );


  let notes;


  switch(sound) {

    case "happy":

      notes =
        [659,784,988];

      break;


    case "school":

      notes =
        [660,660];

      break;


    case "chimes":

      notes =
        [523,659,784,1046];

      break;


    case "beep":

      notes =
        [880,880,880];

      break;


    default:

      notes =
        [523,659,784];

  }


  notes.forEach(
    (frequency,index) => {

      const osc =
        ctx.createOscillator();

      const gain =
        ctx.createGain();


      osc.type =
        sound === "beep"
          ? "square"
          : "sine";

      osc.frequency.value =
        frequency;


      const start =
        ctx.currentTime +
        index * .22;


      gain.gain.setValueAtTime(
        .0001,
        start
      );

      gain.gain
        .exponentialRampToValueAtTime(
          ringing
            ? .18
            : .11,
          start + .03
        );

      gain.gain
        .exponentialRampToValueAtTime(
          .0001,
          start + .38
        );


      osc.connect(gain);

      gain.connect(
        ctx.destination
      );


      osc.start(start);

      osc.stop(
        start + .42
      );

    }
  );


  setTimeout(
    () => {

      try {
        ctx.close();
      }
      catch {}

    },
    1800
  );

}


/* =========================================
   DATE
========================================= */

function getDateKey(
  date
) {

  return (
    date.getFullYear()
    +
    "-"
    +
    String(
      date.getMonth() + 1
    ).padStart(2,"0")
    +
    "-"
    +
    String(
      date.getDate()
    ).padStart(2,"0")
  );

}


/* =========================================
   SAFE HTML
========================================= */

function escapeHTML(
  value
) {

  return String(value)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}
