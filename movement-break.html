<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Movement Break</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --navy: #2f4058;
  --muted: #788598;
  --border: #e3e8ef;
  --background: #f6f8fb;
  --white: #ffffff;

  --teal: #69bea9;
  --teal-light: #eaf8f4;

  --blue: #7f9fe0;
  --blue-light: #eef3ff;

  --purple: #968ad5;
  --purple-light: #f1effb;

  --pink: #df8ca4;
  --pink-light: #fceef3;

  --coral: #dc8a7c;
  --coral-light: #fbefec;
}

body {
  margin: 0;
  min-height: 100vh;

  font-family:
    "Trebuchet MS",
    Arial,
    sans-serif;

  color: var(--navy);

  background:
    radial-gradient(circle at top left, #eef4ff, transparent 34%),
    radial-gradient(circle at bottom right, #eaf8f4, transparent 36%),
    var(--background);
}

button,
input,
select {
  font: inherit;
}

button {
  -webkit-tap-highlight-color: transparent;
}

.page {
  width: min(1100px, calc(100% - 32px));
  margin: 0 auto;
  padding: 24px 0 50px;
}


/* =========================================
   TOP
========================================= */

.topbar {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  margin-bottom: 28px;
}

.tools-button {
  justify-self: start;

  border: 1px solid var(--border);
  background: white;
  color: var(--navy);

  padding: 11px 17px;
  border-radius: 15px;

  font-weight: 900;
  cursor: pointer;

  box-shadow:
    0 4px 12px rgba(50,65,85,.06);
}

.heading {
  text-align: center;
}

.heading h1 {
  margin: 0;

  font-size: clamp(34px, 5vw, 48px);
  letter-spacing: -1px;
}

.heading p {
  margin: 5px 0 0;
  color: var(--muted);
  font-size: 16px;
}


/* =========================================
   CATEGORY GRID
========================================= */

.section-title {
  margin: 0 0 14px;

  font-size: 18px;
  font-weight: 900;
}

.category-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);

  gap: 14px;

  margin-bottom: 30px;
}

.category-card {
  min-height: 145px;

  border: 0;
  border-radius: 24px;

  padding: 22px;

  text-align: left;

  cursor: pointer;

  transition:
    transform .16s ease,
    box-shadow .16s ease;

  box-shadow:
    0 7px 20px rgba(50,65,85,.06);
}

.category-card:hover {
  transform: translateY(-3px);

  box-shadow:
    0 11px 25px rgba(50,65,85,.10);
}

.category-card:active {
  transform: translateY(0);
}

.category-icon {
  font-size: 34px;
  margin-bottom: 15px;
}

.category-name {
  font-size: 21px;
  font-weight: 900;

  color: var(--navy);
}

.category-help {
  margin-top: 4px;

  color: #718096;
  font-size: 13px;
  line-height: 1.35;
}

.card-teal {
  background:
    linear-gradient(135deg, #e8f8f3, #f5fcfa);
}

.card-blue {
  background:
    linear-gradient(135deg, #edf2ff, #f7f9ff);
}

.card-purple {
  background:
    linear-gradient(135deg, #f0edfb, #faf9fe);
}

.card-pink {
  background:
    linear-gradient(135deg, #fceef3, #fff8fa);
}

.card-coral {
  background:
    linear-gradient(135deg, #fbeeea, #fff8f6);
}

.card-mix {
  background:
    linear-gradient(
      135deg,
      #edf2ff,
      #edf9f5,
      #f3effb
    );
}


/* =========================================
   QUICK ACTIONS
========================================= */

.quick-row {
  display: grid;
  grid-template-columns: 1fr 1fr;

  gap: 14px;

  margin-bottom: 32px;
}

.pick-card,
.manage-card {
  border: 1px solid var(--border);
  border-radius: 22px;

  background: white;

  padding: 20px 22px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 16px;

  box-shadow:
    0 6px 18px rgba(50,65,85,.05);
}

.quick-text h3 {
  margin: 0 0 4px;

  font-size: 18px;
}

.quick-text p {
  margin: 0;

  color: var(--muted);

  font-size: 13px;
}

.pick-button {
  border: 0;

  background: var(--teal);
  color: white;

  padding: 13px 18px;

  border-radius: 15px;

  font-weight: 900;

  cursor: pointer;

  white-space: nowrap;
}

.manage-button {
  border: 0;

  background: var(--blue-light);
  color: #6078b7;

  padding: 13px 18px;

  border-radius: 15px;

  font-weight: 900;

  cursor: pointer;

  white-space: nowrap;
}


/* =========================================
   FAVORITES
========================================= */

.favorite-area {
  background: white;

  border: 1px solid var(--border);
  border-radius: 26px;

  padding: 24px;

  box-shadow:
    0 7px 22px rgba(50,65,85,.05);
}

.favorite-header {
  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 10px;

  margin-bottom: 16px;
}

.favorite-title {
  font-size: 19px;
  font-weight: 900;
}

.favorite-count {
  font-size: 13px;
  color: var(--muted);
  font-weight: 800;
}

.favorite-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);

  gap: 10px;
}

.favorite-item {
  border: 1px solid var(--border);

  background: #fafbfd;

  border-radius: 16px;

  padding: 14px 16px;

  cursor: pointer;

  text-align: left;

  transition:
    background .15s ease,
    transform .15s ease;
}

.favorite-item:hover {
  background: var(--teal-light);
  transform: translateY(-1px);
}

.favorite-name {
  font-weight: 900;
  font-size: 15px;

  margin-bottom: 3px;
}

.favorite-category {
  color: var(--muted);
  font-size: 12px;
}

.no-favorites {
  grid-column: 1 / -1;

  padding: 32px 15px;

  text-align: center;

  color: var(--muted);
}


/* =========================================
   MODAL
========================================= */

.modal-backdrop {
  display: none;

  position: fixed;
  inset: 0;

  z-index: 100;

  padding: 20px;

  overflow-y: auto;

  background:
    rgba(38,51,70,.36);

  backdrop-filter:
    blur(5px);
}

.modal-backdrop.open {
  display: flex;
  align-items: flex-start;
  justify-content: center;
}

.modal {
  width: min(650px,100%);

  margin: 28px auto;

  background: white;

  border-radius: 28px;

  padding: 25px;

  box-shadow:
    0 25px 70px rgba(30,45,65,.24);
}

.modal-top {
  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 12px;

  margin-bottom: 21px;
}

.modal-title {
  font-size: 25px;
  font-weight: 900;
}

.close-button {
  width: 40px;
  height: 40px;

  border: 0;

  border-radius: 50%;

  background: #f1f4f8;

  color: #697587;

  font-size: 21px;

  cursor: pointer;
}


/* =========================================
   FORM
========================================= */

.field {
  margin-bottom: 15px;
}

.field-label {
  display: block;

  margin-bottom: 7px;

  font-size: 14px;
  font-weight: 900;
}

.text-input,
.select-input {
  width: 100%;

  border: 1px solid var(--border);

  background: #f9fafc;

  color: var(--navy);

  padding: 12px 14px;

  border-radius: 14px;

  font-size: 15px;
}

.text-input:focus,
.select-input:focus {
  outline: 3px solid rgba(127,159,224,.16);
  border-color: var(--blue);
}

.add-video-button {
  width: 100%;

  border: 0;

  background: var(--teal);
  color: white;

  padding: 13px 18px;

  border-radius: 14px;

  font-weight: 900;

  cursor: pointer;

  margin-top: 4px;
}


/* =========================================
   SAVED VIDEO LIST
========================================= */

.saved-heading {
  margin-top: 25px;
  margin-bottom: 9px;

  font-size: 15px;
  font-weight: 900;
}

.saved-list {
  max-height: 310px;

  overflow-y: auto;

  border-top: 1px solid var(--border);
}

.saved-item {
  display: grid;

  grid-template-columns:
    1fr
    auto;

  align-items: center;

  gap: 10px;

  padding: 12px 4px;

  border-bottom: 1px solid #edf0f4;
}

.saved-name {
  font-size: 14px;
  font-weight: 900;
}

.saved-meta {
  margin-top: 2px;

  color: var(--muted);

  font-size: 12px;
}

.saved-actions {
  display: flex;
  align-items: center;

  gap: 6px;
}

.open-small,
.delete-small {
  border: 0;

  padding: 8px 10px;

  border-radius: 10px;

  font-size: 12px;
  font-weight: 900;

  cursor: pointer;
}

.open-small {
  background: var(--blue-light);
  color: #6078b7;
}

.delete-small {
  background: var(--pink-light);
  color: #a7687a;
}

.no-saved {
  padding: 25px 10px;

  text-align: center;

  color: var(--muted);
}


/* =========================================
   PICK FOR ME OVERLAY
========================================= */

.pick-overlay {
  display: none;

  position: fixed;
  inset: 0;

  z-index: 300;

  align-items: center;
  justify-content: center;

  padding: 25px;

  background:
    rgba(238,243,250,.96);

  backdrop-filter: blur(5px);
}

.pick-overlay.show {
  display: flex;
}

.pick-result {
  width: min(650px,100%);

  text-align: center;

  background: white;

  border-radius: 32px;

  padding: 42px 28px;

  box-shadow:
    0 20px 60px rgba(40,55,75,.18);
}

.pick-result-label {
  color: var(--muted);

  font-size: 15px;
  font-weight: 900;

  margin-bottom: 14px;
}

.pick-result-name {
  font-size: clamp(36px,7vw,60px);

  font-weight: 900;

  line-height: 1.05;
}

.pick-result-category {
  margin-top: 10px;

  color: var(--muted);

  font-size: 15px;
}

.pick-result-actions {
  display: flex;
  justify-content: center;

  gap: 10px;

  margin-top: 26px;

  flex-wrap: wrap;
}

.go-button {
  border: 0;

  background: var(--teal);
  color: white;

  padding: 14px 21px;

  border-radius: 15px;

  font-weight: 900;

  cursor: pointer;
}

.pick-again-button,
.cancel-pick-button {
  border: 1px solid var(--border);

  background: white;
  color: #69768a;

  padding: 14px 18px;

  border-radius: 15px;

  font-weight: 900;

  cursor: pointer;
}


/* =========================================
   RESPONSIVE
========================================= */

@media(max-width: 800px) {

  .category-grid {
    grid-template-columns: repeat(2,1fr);
  }

  .quick-row {
    grid-template-columns: 1fr;
  }

}

@media(max-width: 620px) {

  .topbar {
    grid-template-columns: 1fr;

    gap: 12px;

    text-align: center;
  }

  .tools-button {
    justify-self: center;
    order: 2;
  }

  .heading {
    order: 1;
  }

  .category-grid,
  .favorite-grid {
    grid-template-columns: 1fr;
  }

  .pick-card,
  .manage-card {
    flex-direction: column;
    align-items: stretch;
  }

  .pick-button,
  .manage-button {
    width: 100%;
  }

}

</style>
</head>


<body>

<div class="page">


  <!-- =====================================
       HEADER
  ====================================== -->

  <header class="topbar">

    <button
      id="toolsButton"
      class="tools-button"
      type="button">
      ⌂ Tools
    </button>

    <div class="heading">

      <h1>Movement Break</h1>

      <p>
        Choose something fun and get moving.
      </p>

    </div>

    <div></div>

  </header>



  <!-- =====================================
       MOVEMENT CATEGORIES
  ====================================== -->

  <div class="section-title">
    Choose a Break
  </div>


  <div class="category-grid">


    <button
      class="category-card card-teal"
      type="button"
      data-search="Danny Go">

      <div class="category-icon">
        🏃
      </div>

      <div class="category-name">
        Danny Go
      </div>

      <div class="category-help">
        Movement, dancing and high-energy brain breaks
      </div>

    </button>



    <button
      class="category-card card-blue"
      type="button"
      data-search="Just Dance kids">

      <div class="category-icon">
        🎵
      </div>

      <div class="category-name">
        Just Dance
      </div>

      <div class="category-help">
        Dance-along videos and favorite songs
      </div>

    </button>



    <button
      class="category-card card-purple"
      type="button"
      data-search="GoNoodle movement">

      <div class="category-icon">
        🤸
      </div>

      <div class="category-name">
        GoNoodle
      </div>

      <div class="category-help">
        Classroom movement and brain breaks
      </div>

    </button>



    <button
      class="category-card card-pink"
      type="button"
      data-search="freeze dance kids">

      <div class="category-icon">
        🪩
      </div>

      <div class="category-name">
        Freeze Dance
      </div>

      <div class="category-help">
        Dance, stop, freeze and repeat
      </div>

    </button>



    <button
      id="favoritesCategory"
      class="category-card card-coral"
      type="button">

      <div class="category-icon">
        ♥
      </div>

      <div class="category-name">
        Teacher Favorites
      </div>

      <div class="category-help">
        Your saved go-to movement videos
      </div>

    </button>



    <button
      id="categoryRandomButton"
      class="category-card card-mix"
      type="button">

      <div class="category-icon">
        🎲
      </div>

      <div class="category-name">
        Pick for Me
      </div>

      <div class="category-help">
        Let the computer choose today's break
      </div>

    </button>


  </div>



  <!-- =====================================
       QUICK ACTIONS
  ====================================== -->

  <div class="quick-row">


    <div class="pick-card">

      <div class="quick-text">

        <h3>
          Can't decide?
        </h3>

        <p>
          Pick randomly from your saved videos.
        </p>

      </div>

      <button
        id="pickForMeButton"
        class="pick-button"
        type="button">
        🎲 Pick for Me
      </button>

    </div>



    <div class="manage-card">

      <div class="quick-text">

        <h3>
          Your videos
        </h3>

        <p>
          Add the exact YouTube videos your class loves.
        </p>

      </div>

      <button
        id="manageVideosButton"
        class="manage-button"
        type="button">
        ⚙ Manage Videos
      </button>

    </div>


  </div>



  <!-- =====================================
       FAVORITES
  ====================================== -->

  <section
    id="favoritesSection"
    class="favorite-area">

    <div class="favorite-header">

      <div class="favorite-title">
        ♥ Saved Favorites
      </div>

      <div
        id="favoriteCount"
        class="favorite-count">
        0 videos
      </div>

    </div>

    <div
      id="favoriteGrid"
      class="favorite-grid">
    </div>

  </section>


</div>



<!-- =======================================
     MANAGE VIDEOS
======================================= -->

<div
  id="videoModal"
  class="modal-backdrop">

  <div
    class="modal"
    role="dialog"
    aria-modal="true">

    <div class="modal-top">

      <div class="modal-title">
        Manage Videos
      </div>

      <button
        id="closeModalButton"
        class="close-button"
        type="button">
        ×
      </button>

    </div>


    <div class="field">

      <label
        class="field-label"
        for="videoName">
        Video Name
      </label>

      <input
        id="videoName"
        class="text-input"
        type="text"
        maxlength="80"
        placeholder="Example: The Floor Is Lava">

    </div>


    <div class="field">

      <label
        class="field-label"
        for="videoUrl">
        YouTube Link
      </label>

      <input
        id="videoUrl"
        class="text-input"
        type="url"
        placeholder="Paste YouTube link here">

    </div>


    <div class="field">

      <label
        class="field-label"
        for="videoCategory">
        Category
      </label>

      <select
        id="videoCategory"
        class="select-input">

        <option value="Danny Go">
          Danny Go
        </option>

        <option value="Just Dance">
          Just Dance
        </option>

        <option value="GoNoodle">
          GoNoodle
        </option>

        <option value="Freeze Dance">
          Freeze Dance
        </option>

        <option value="Other">
          Other
        </option>

      </select>

    </div>


    <button
      id="addVideoButton"
      class="add-video-button"
      type="button">
      + Add Video
    </button>


    <div class="saved-heading">
      Saved Videos
    </div>


    <div
      id="savedVideoList"
      class="saved-list">
    </div>

  </div>

</div>



<!-- =======================================
     RANDOM PICK RESULT
======================================= -->

<div
  id="pickOverlay"
  class="pick-overlay">

  <div class="pick-result">

    <div class="pick-result-label">
      Today's movement break
    </div>

    <div
      id="pickResultName"
      class="pick-result-name">
      Movement Break
    </div>

    <div
      id="pickResultCategory"
      class="pick-result-category">
    </div>

    <div class="pick-result-actions">

      <button
        id="goToVideoButton"
        class="go-button"
        type="button">
        ▶ Open Video
      </button>

      <button
        id="pickAgainButton"
        class="pick-again-button"
        type="button">
        🎲 Pick Again
      </button>

      <button
        id="cancelPickButton"
        class="cancel-pick-button"
        type="button">
        Cancel
      </button>

    </div>

  </div>

</div>



<script>

/* =========================================
   STORAGE
========================================= */

const VIDEO_STORAGE_KEY =
  "classroomMovementVideosV1";


let videos = [];

let selectedRandomVideo = null;


/* =========================================
   ELEMENTS
========================================= */

const videoModal =
  document.getElementById(
    "videoModal"
  );

const videoName =
  document.getElementById(
    "videoName"
  );

const videoUrl =
  document.getElementById(
    "videoUrl"
  );

const videoCategory =
  document.getElementById(
    "videoCategory"
  );

const savedVideoList =
  document.getElementById(
    "savedVideoList"
  );

const favoriteGrid =
  document.getElementById(
    "favoriteGrid"
  );

const favoriteCount =
  document.getElementById(
    "favoriteCount"
  );

const pickOverlay =
  document.getElementById(
    "pickOverlay"
  );

const pickResultName =
  document.getElementById(
    "pickResultName"
  );

const pickResultCategory =
  document.getElementById(
    "pickResultCategory"
  );


/* =========================================
   LOAD / SAVE
========================================= */

function loadVideos() {

  try {

    const saved =
      localStorage.getItem(
        VIDEO_STORAGE_KEY
      );

    videos =
      saved
        ? JSON.parse(saved)
        : [];

  }

  catch {

    videos = [];

  }

}


function saveVideos() {

  localStorage.setItem(
    VIDEO_STORAGE_KEY,
    JSON.stringify(videos)
  );

}


/* =========================================
   CATEGORY SEARCHES
========================================= */

document
  .querySelectorAll(
    "[data-search]"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          openYouTubeSearch(
            button.dataset.search
          );

        }
      );

    }
  );


function openYouTubeSearch(
  search
) {

  const url =
    "https://www.youtube.com/results?search_query=" +
    encodeURIComponent(search);

  window.open(
    url,
    "_blank",
    "noopener"
  );

}


/* =========================================
   FAVORITES CATEGORY
========================================= */

document
  .getElementById(
    "favoritesCategory"
  )
  .addEventListener(
    "click",
    () => {

      document
        .getElementById(
          "favoritesSection"
        )
        .scrollIntoView({
          behavior: "smooth",
          block: "center"
        });

    }
  );


/* =========================================
   MANAGE VIDEOS
========================================= */

document
  .getElementById(
    "manageVideosButton"
  )
  .addEventListener(
    "click",
    openVideoModal
  );


function openVideoModal() {

  renderSavedVideos();

  videoModal
    .classList
    .add("open");


  setTimeout(
    () => {

      videoName.focus();

    },
    50
  );

}


/* =========================================
   CLOSE MODAL
========================================= */

function closeVideoModal() {

  videoModal
    .classList
    .remove("open");

}


document
  .getElementById(
    "closeModalButton"
  )
  .addEventListener(
    "click",
    closeVideoModal
  );


videoModal.addEventListener(
  "click",
  event => {

    if (
      event.target ===
      videoModal
    ) {

      closeVideoModal();

    }

  }
);


/* =========================================
   ADD VIDEO
========================================= */

document
  .getElementById(
    "addVideoButton"
  )
  .addEventListener(
    "click",
    addVideo
  );


function addVideo() {

  const name =
    videoName.value.trim();

  const url =
    videoUrl.value.trim();

  const category =
    videoCategory.value;


  if (
    !name
  ) {

    alert(
      "Give the video a name."
    );

    return;

  }


  if (
    !url
  ) {

    alert(
      "Paste the YouTube link."
    );

    return;

  }


  if (
    !isValidYouTubeUrl(url)
  ) {

    alert(
      "That doesn't look like a YouTube link."
    );

    return;

  }


  videos.push({

    id:
      "video_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .slice(2,7),

    name:
      name,

    url:
      url,

    category:
      category

  });


  saveVideos();


  videoName.value =
    "";

  videoUrl.value =
    "";


  renderSavedVideos();

  renderFavorites();


  videoName.focus();

}


/* =========================================
   VALIDATE YOUTUBE
========================================= */

function isValidYouTubeUrl(
  value
) {

  try {

    const url =
      new URL(value);

    const host =
      url.hostname
        .toLowerCase()
        .replace(
          /^www\./,
          ""
        );


    return (
      host === "youtube.com" ||
      host === "m.youtube.com" ||
      host === "youtu.be" ||
      host === "music.youtube.com"
    );

  }

  catch {

    return false;

  }

}


/* =========================================
   SAVED VIDEO LIST
========================================= */

function renderSavedVideos() {

  savedVideoList.innerHTML =
    "";


  if (
    videos.length === 0
  ) {

    const empty =
      document.createElement(
        "div"
      );

    empty.className =
      "no-saved";

    empty.textContent =
      "No saved videos yet.";

    savedVideoList
      .appendChild(
        empty
      );

    return;

  }


  const sorted =
    [...videos]
      .sort(
        (a,b) =>
          a.name.localeCompare(
            b.name
          )
      );


  sorted.forEach(
    video => {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "saved-item";


      const info =
        document.createElement(
          "div"
        );


      const name =
        document.createElement(
          "div"
        );

      name.className =
        "saved-name";

      name.textContent =
        video.name;


      const meta =
        document.createElement(
          "div"
        );

      meta.className =
        "saved-meta";

      meta.textContent =
        video.category;


      info.appendChild(
        name
      );

      info.appendChild(
        meta
      );


      const actions =
        document.createElement(
          "div"
        );

      actions.className =
        "saved-actions";


      const openButton =
        document.createElement(
          "button"
        );

      openButton.type =
        "button";

      openButton.className =
        "open-small";

      openButton.textContent =
        "Open";


      openButton.addEventListener(
        "click",
        () => {

          openVideo(
            video.url
          );

        }
      );


      const deleteButton =
        document.createElement(
          "button"
        );

      deleteButton.type =
        "button";

      deleteButton.className =
        "delete-small";

      deleteButton.textContent =
        "Delete";


      deleteButton.addEventListener(
        "click",
        () => {

          deleteVideo(
            video.id
          );

        }
      );


      actions.appendChild(
        openButton
      );

      actions.appendChild(
        deleteButton
      );


      row.appendChild(
        info
      );

      row.appendChild(
        actions
      );


      savedVideoList
        .appendChild(
          row
        );

    }
  );

}


/* =========================================
   FAVORITES
========================================= */

function renderFavorites() {

  favoriteGrid.innerHTML =
    "";


  favoriteCount.textContent =
    videos.length +
    (
      videos.length === 1
        ? " video"
        : " videos"
    );


  if (
    videos.length === 0
  ) {

    const empty =
      document.createElement(
        "div"
      );

    empty.className =
      "no-favorites";

    empty.innerHTML =
      "No favorites saved yet.<br>" +
      "Use <strong>Manage Videos</strong> to add your class favorites.";

    favoriteGrid
      .appendChild(
        empty
      );

    return;

  }


  videos.forEach(
    video => {

      const card =
        document.createElement(
          "button"
        );

      card.type =
        "button";

      card.className =
        "favorite-item";


      const name =
        document.createElement(
          "div"
        );

      name.className =
        "favorite-name";

      name.textContent =
        "▶ " + video.name;


      const category =
        document.createElement(
          "div"
        );

      category.className =
        "favorite-category";

      category.textContent =
        video.category;


      card.appendChild(
        name
      );

      card.appendChild(
        category
      );


      card.addEventListener(
        "click",
        () => {

          openVideo(
            video.url
          );

        }
      );


      favoriteGrid
        .appendChild(
          card
        );

    }
  );

}


/* =========================================
   DELETE
========================================= */

function deleteVideo(
  id
) {

  videos =
    videos.filter(
      video =>
        video.id !== id
    );


  saveVideos();

  renderSavedVideos();

  renderFavorites();

}


/* =========================================
   OPEN VIDEO
========================================= */

function openVideo(
  url
) {

  window.open(
    url,
    "_blank",
    "noopener"
  );

}


/* =========================================
   PICK FOR ME
========================================= */

document
  .getElementById(
    "pickForMeButton"
  )
  .addEventListener(
    "click",
    pickRandomVideo
  );


document
  .getElementById(
    "categoryRandomButton"
  )
  .addEventListener(
    "click",
    pickRandomVideo
  );


function pickRandomVideo() {

  if (
    videos.length === 0
  ) {

    alert(
      "Add at least one favorite video first."
    );

    openVideoModal();

    return;

  }


  selectedRandomVideo =
    videos[
      Math.floor(
        Math.random() *
        videos.length
      )
    ];


  pickResultName.textContent =
    selectedRandomVideo.name;


  pickResultCategory.textContent =
    selectedRandomVideo.category;


  pickOverlay
    .classList
    .add("show");

}


/* =========================================
   RANDOM RESULT BUTTONS
========================================= */

document
  .getElementById(
    "goToVideoButton"
  )
  .addEventListener(
    "click",
    () => {

      if (
        selectedRandomVideo
      ) {

        openVideo(
          selectedRandomVideo.url
        );

        closePickOverlay();

      }

    }
  );


document
  .getElementById(
    "pickAgainButton"
  )
  .addEventListener(
    "click",
    pickRandomVideo
  );


document
  .getElementById(
    "cancelPickButton"
  )
  .addEventListener(
    "click",
    closePickOverlay
  );


pickOverlay.addEventListener(
  "click",
  event => {

    if (
      event.target ===
      pickOverlay
    ) {

      closePickOverlay();

    }

  }
);


function closePickOverlay() {

  pickOverlay
    .classList
    .remove("show");

}


/* =========================================
   TOOLS
========================================= */

document
  .getElementById(
    "toolsButton"
  )
  .addEventListener(
    "click",
    () => {

      location.href =
        "index.html";

    }
  );


/* =========================================
   INITIALIZE
========================================= */

loadVideos();

renderFavorites();

renderSavedVideos();

</script>
